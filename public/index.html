<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A party quiz for your telly. Phones join with a room code.">
<title>House Party Quiz</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Layout: one-screen game show stage. Host = header / stage / control bar. Phone = single column controller. Deliberate single dark "studio" look. */
:root{
  --studio:#15112e; --panel:#221c4a; --panel-2:#2c2560; --line:#40378a;
  --text:#f7f4ff; --muted:#b4acdf;
  --t1:#ff7a2f; --t2:#14c4b0; --t3:#ff4f9a; --t4:#ffd23f; --t5:#8e9bff; --t6:#b5e655; --t7:#5ec8ff; --t8:#f7a8ff; --t9:#ffb347; --t10:#ff8f70; --t11:#ff6fb1; --t12:#c9a7ff;
  --sea:#1d3a63; --land:#3f8f6b; --land-edge:#5fb88f;
  --good:#40e08a; --bad:#ff6363; --on-tile:#15112e;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--studio);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(ellipse at 50% -20%,var(--panel-2) 0%,transparent 60%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#app{min-height:100%;display:flex;flex-direction:column;max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 22px;font-weight:700;color:var(--on-tile);background:var(--t4);
  box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
button:focus-visible,input:focus-visible{outline:3px solid var(--t2);outline-offset:3px}
button.ghost{background:transparent;color:var(--text);box-shadow:none;border:2px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
input{font:inherit;font-size:20px;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--text)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.banner{background:var(--panel);border:2px dashed var(--line);border-radius:14px;padding:12px 16px;color:var(--muted);font-size:14px}

/* start */
.start{flex:1;display:grid;place-items:center;padding-block:32px}
.start-inner{max-width:720px;width:100%;display:flex;flex-direction:column;gap:28px}
.logo{font-family:var(--display);font-size:clamp(44px,9vw,96px);line-height:.92}
.logo span:nth-child(1){color:var(--t1)}.logo span:nth-child(2){color:var(--t2)}.logo span:nth-child(3){color:var(--t4)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.choice{text-align:left;padding:22px;border-radius:20px;display:flex;flex-direction:column;gap:6px}
.choice b{font-family:var(--display);font-weight:400;font-size:26px}
.choice span{font-weight:500;font-size:15px;opacity:.85}
.c-host{background:var(--t2)}.c-join{background:var(--t3)}
.rounds-preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rp{border-radius:14px;padding:12px 14px;background:var(--panel);border-left:6px solid var(--c)}
.rp b{display:block;font-size:15px}.rp small{color:var(--muted);font-size:13px}

/* host stage */
.hbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:16px;flex-wrap:wrap}
.code-chip{font-family:var(--mono);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:18px;letter-spacing:.2em}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding-block:12px 24px;min-height:0}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px max(16px,env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);flex-wrap:wrap}
.code-big{display:flex;gap:12px;flex-wrap:wrap}
.code-big div{font-family:var(--display);font-size:clamp(56px,10vw,120px);width:1.25em;height:1.35em;display:grid;place-items:center;border-radius:18px;color:var(--on-tile)}
.code-big div:nth-child(1){background:var(--t1)}.code-big div:nth-child(2){background:var(--t2)}.code-big div:nth-child(3){background:var(--t3)}.code-big div:nth-child(4){background:var(--t4)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:8px 14px;border-radius:999px;font-weight:700;color:var(--on-tile);background:var(--c);animation:pop .3s ease-out}
.chip.wait{background:transparent;color:var(--muted);border:2px solid var(--line)}
.chip.done{background:var(--c)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.round-no{font-family:var(--display);color:var(--muted);font-size:22px}
.intro-title{font-size:clamp(52px,9vw,118px);line-height:.95;color:var(--c)}
.rules{font-size:clamp(18px,2.2vw,26px);max-width:40ch}
.qwrap{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}
.qcard{background:var(--panel);border-radius:26px;padding:clamp(20px,4vw,44px);display:flex;flex-direction:column;gap:18px;border-top:10px solid var(--c);min-width:0}
.qtext{font-size:clamp(24px,3.6vw,46px);font-weight:700;line-height:1.15;text-wrap:balance}
.emoji{font-size:clamp(80px,13vw,170px);line-height:1}
.smash{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.plus{font-family:var(--display);font-size:48px;color:var(--c)}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}
.pair .clue{background:var(--panel-2);border-radius:18px;padding:22px;font-size:clamp(20px,2.6vw,32px);font-weight:700}
.order-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.oi{border-radius:16px;padding:16px;font-weight:700;font-size:clamp(17px,2vw,22px);color:var(--on-tile)}
.oi:nth-child(4n+1){background:var(--t1)}.oi:nth-child(4n+2){background:var(--t2)}.oi:nth-child(4n+3){background:var(--t3)}.oi:nth-child(4n+4){background:var(--t4)}
.timer{width:150px;height:150px;position:relative;display:grid;place-items:center}
.timer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.timer b{font-family:var(--display);font-size:52px;font-weight:400;font-variant-numeric:tabular-nums}
.answered{font-size:18px;color:var(--muted)}
.reveal-ans{font-family:var(--display);font-size:clamp(40px,7vw,92px);line-height:1;color:var(--c);overflow-wrap:anywhere}
.reveal-sub{font-size:clamp(18px,2.2vw,26px);color:var(--muted)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.res{display:flex;justify-content:space-between;gap:10px;background:var(--panel);border-radius:14px;padding:12px 16px;min-width:0}
.res .who{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .what{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .pts{font-family:var(--display);font-size:22px;color:var(--good);font-variant-numeric:tabular-nums}
.res .pts.zero{color:var(--muted)}
.board{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:2.2em minmax(0,12em) 1fr 3.5em;gap:12px;align-items:center;font-size:20px}
.bar .pos{font-family:var(--display);color:var(--muted)}
.bar .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:28px;background:var(--panel);border-radius:8px;overflow:hidden}
.bar .fill{height:100%;background:var(--c);border-radius:8px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar .sc{font-family:var(--display);text-align:right;font-variant-numeric:tabular-nums}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;max-width:760px}
.pod{border-radius:18px 18px 0 0;padding:16px;text-align:center;color:var(--on-tile);display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-width:0}
.pod b{font-family:var(--display);font-weight:400;font-size:clamp(18px,2.6vw,30px);overflow-wrap:anywhere}
.pod span{font-weight:700}
.pod.p1{background:var(--t4);height:260px}.pod.p2{background:var(--t2);height:200px}.pod.p3{background:var(--t1);height:160px}

.vote-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.vopt{background:var(--panel);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px;border-top:8px solid var(--c);transition:opacity .4s,transform .4s;min-width:0}
.vopt b{font-family:var(--display);font-weight:400;font-size:clamp(20px,2.4vw,28px);color:var(--c)}
.vopt small{color:var(--muted);font-size:15px}
.vopt .vcount{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.vopt .track{height:14px;background:var(--studio);border-radius:7px;overflow:hidden}
.vopt .fill{height:100%;background:var(--c);transition:width .5s}
.vopt.win{background:var(--c);transform:scale(1.04)}.vopt.win b,.vopt.win .vcount{color:var(--on-tile)}
.vopt.lose{opacity:.45}
.pvote{display:grid;gap:12px}
.pvote button{text-align:left;background:var(--c);display:flex;flex-direction:column;gap:2px;padding:18px}
.pvote button b{font-family:var(--display);font-weight:400;font-size:22px}
.pvote button span{font-weight:500;font-size:14px}
.map{display:block;width:100%;height:100%;border-radius:16px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.host-map{width:100%;max-height:52vh;aspect-ratio:5/2;border-radius:16px;overflow:hidden;background:var(--sea)}
.pmap{position:relative;width:100%;height:clamp(260px,56vh,560px);border-radius:16px;overflow:hidden;background:var(--sea);border:2px solid var(--line);cursor:crosshair}
.pmap .map{touch-action:none;border-radius:0}
.pmap-ctl{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:8px;z-index:1}
.pmap-ctl button{width:44px;height:44px;padding:0;border-radius:12px;font-size:22px;line-height:1;background:var(--studio);color:var(--text);border:2px solid var(--line);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.pmap-hint{font-size:14px;color:var(--muted)}
.wheel-wrap{display:grid;place-items:center}
.wheel{width:min(62vh,520px,100%);height:auto;filter:drop-shadow(0 10px 0 rgba(0,0,0,.35))}
.wheel-wrap.landed .wheel{animation:land .5s ease-out}
@keyframes land{50%{transform:scale(1.05)}}
.letter-tile{font-family:var(--display);font-size:clamp(90px,14vw,170px);line-height:1;width:1.3em;height:1.3em;display:grid;place-items:center;border-radius:28px;background:var(--t6);color:var(--on-tile);flex:none}
.letter-tile.small{font-size:72px}
.cat-list{margin:0;padding-left:1.4em;display:grid;gap:8px;font-size:clamp(20px,2.6vw,32px);font-weight:700}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.cat{background:var(--panel);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ans-list{display:flex;flex-direction:column;gap:6px}
.ans{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:10px;text-align:left;padding:8px 12px;border-radius:12px;box-shadow:none;background:var(--panel-2);color:var(--text);border-left:6px solid var(--c);font-weight:500}
.ans .aw{font-weight:700;overflow-wrap:anywhere}
.ans small{grid-row:2;color:var(--muted);font-size:12px}
.ans em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-family:var(--display);font-size:20px;color:var(--good)}
.ans.shared em{color:var(--t4)}
.ans.bad,.ans.struck{opacity:.55}.ans.bad em,.ans.struck em{color:var(--muted)}
.ans.struck .aw{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--bad)}
.ans.bad:disabled{opacity:.45}
.ans.pending em{color:var(--muted)}
.ans.gm{grid-template-columns:1fr auto}
.ans.gm .gm-btns{grid-row:1/3;grid-column:2;align-self:center;display:flex;gap:6px}
.ans.gm .aw{overflow-wrap:break-word;word-break:normal;hyphens:auto}
.gm-btns button{width:38px;height:38px;padding:0;border-radius:10px;font-size:20px;box-shadow:none;background:var(--panel);color:var(--muted);border:2px solid var(--line)}
.ans.gm.yes .gm-yes{background:var(--good);color:var(--on-tile);border-color:var(--good)}
.ans.gm.no .gm-no{background:var(--bad);color:var(--on-tile);border-color:var(--bad)}
.ans.gm.no .aw{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:3px}
.ans.gm.pending{outline:2px dashed var(--line);outline-offset:-2px}
div.ans{cursor:default}
.chk-list{display:flex;flex-direction:column;gap:14px}
.chk{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--panel-2);color:var(--text);box-shadow:none;border:2px solid var(--line);padding:12px 14px}
.chk span{font-weight:700;overflow-wrap:anywhere;min-width:0}
.chk b{flex:none;font-size:14px;color:var(--good)}
.chk.no{border-color:var(--bad);background:var(--panel)}
.chk.no span{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:3px}
.chk.no b{color:var(--bad)}
.odd-items .oi{font-size:clamp(20px,2.6vw,30px);padding:22px;text-align:center;transition:opacity .3s,transform .3s}
.oi.dim{opacity:.3}.oi.hit{transform:scale(1.06);outline:5px solid var(--text);outline-offset:3px}
.hl{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:stretch}
.hlc{background:var(--panel-2);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:0}
.hlc b{font-size:clamp(20px,2.6vw,32px);overflow-wrap:anywhere}
.hlc .hv{font-family:var(--display);font-size:clamp(28px,4vw,54px);color:var(--t9);font-variant-numeric:tabular-nums}
.hlc.hidden .hv{font-family:var(--body);font-weight:700;font-size:clamp(18px,2vw,26px);color:var(--muted)}
.hlvs{align-self:center;font-family:var(--display);font-size:clamp(28px,4vw,56px);color:var(--muted)}
.chip.out{text-decoration:line-through}
.kind-chip.lt-chip{background:var(--t11)}
.lt-title{display:flex;flex-wrap:wrap;gap:14px 22px}
.lt-word{display:flex;gap:5px}
.lt-tile{width:clamp(24px,3.4vw,44px);height:clamp(34px,4.8vw,58px);border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-size:clamp(18px,2.8vw,32px);background:var(--panel-2);color:var(--muted)}
.lt-tile.first{background:var(--t11);color:var(--on-tile)}
.lt-tile.shown{background:var(--good);color:var(--on-tile)}
.lt-tile.punct{background:transparent;width:auto;padding-inline:1px;color:var(--text)}
.lt-mask{font-family:var(--mono);font-size:20px;letter-spacing:.12em;line-height:1.5;overflow-wrap:anywhere}
.kind-chip.tf-chip{background:var(--t10)}
.tf-verdict{align-self:flex-start;font-family:var(--display);font-size:clamp(32px,5vw,64px);padding:6px 22px;border-radius:16px;color:var(--on-tile)}
.tf-verdict.yes{background:var(--good)}.tf-verdict.no{background:var(--bad)}
.phl.ptf button:last-child{background:var(--bad)}
.podd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.podd button{min-height:96px;font-size:18px;overflow-wrap:anywhere}
.podd button:nth-child(1){background:var(--t1)}.podd button:nth-child(2){background:var(--t2)}.podd button:nth-child(3){background:var(--t3)}.podd button:nth-child(4){background:var(--t4)}
.phl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.phl button{min-height:110px;font-size:24px}
.phl button:first-child{background:var(--good)}.phl button:last-child{background:var(--t3)}
@media (max-width:720px){.hl{grid-template-columns:1fr}.hlvs{text-align:center}}
.plet{font-family:var(--display);font-size:64px;line-height:1;color:var(--on-tile);background:var(--t6);border-radius:18px;width:1.4em;height:1.4em;display:grid;place-items:center}
.kind-chip{align-self:flex-start;font-weight:700;font-size:clamp(16px,1.8vw,22px);padding:8px 16px;border-radius:999px;background:var(--t7);color:var(--on-tile)}
.kind-chip.small{font-size:14px;padding:5px 12px}
.emoji-clue{font-size:clamp(64px,10vw,140px);line-height:1.15;letter-spacing:.08em;overflow-wrap:anywhere}
.seg{display:inline-flex;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:5px;align-self:flex-start;flex-wrap:wrap}
.seg button{background:transparent;color:var(--muted);box-shadow:none;padding:10px 18px;border-radius:11px}
.seg button.on{background:var(--t2);color:var(--on-tile)}
.xmas-badge{background:#e8434b !important;color:#fff !important}
.seg button.xmas-on{background:#e8434b;color:#fff}
body.xmas::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 140px 80px,#fff,transparent),radial-gradient(1.5px 1.5px at 260px 150px,#fff,transparent),radial-gradient(2.5px 2.5px at 80px 210px,#fff,transparent),radial-gradient(1.5px 1.5px at 330px 260px,#fff,transparent);
  background-size:360px 300px;animation:snow 18s linear infinite}
body.xmas #app{position:relative;z-index:1}
@keyframes snow{from{background-position:0 -300px}to{background-position:60px 300px}}
.teen-badge{background:var(--t6);color:var(--on-tile);font-weight:700;font-size:13px;padding:5px 10px;border-radius:999px}
/* phone */
.phone{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:18px max(18px,env(safe-area-inset-bottom,0px));max-width:520px;width:100%;margin:0 auto}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.me{padding:6px 12px;border-radius:999px;font-weight:700;color:var(--on-tile);background:var(--c)}
.pscore{font-family:var(--display);font-size:20px}
.pmain{flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center}
.big-msg{font-family:var(--display);font-size:clamp(30px,8vw,44px);line-height:1.05}
.ptimer{font-family:var(--display);font-size:22px;color:var(--t4);font-variant-numeric:tabular-nums}
.pclue{background:var(--panel);border-radius:18px;padding:16px;font-weight:500}
.pick{display:grid;gap:10px}
.pick button{text-align:left;display:flex;gap:12px;align-items:center;background:var(--panel-2);color:var(--text);box-shadow:none;border:2px solid var(--line)}
.pick button .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);background:var(--studio);color:var(--muted);flex:none}
.pick button.sel{background:var(--t2);color:var(--on-tile);border-color:var(--t2)}
.pick button.sel .n{background:var(--on-tile);color:var(--t2)}
.delta{font-family:var(--display);font-size:72px;line-height:1}
.delta.good{color:var(--good)}.delta.bad{color:var(--bad)}
.res .pts.neg{color:var(--bad)}
.pic-wrap{display:flex;justify-content:center;overflow:hidden;border-radius:18px;background:#000}
.pic{display:block;max-width:100%;max-height:min(46vh,520px);object-fit:contain;filter:invert(1)}
.pic-wrap.small .pic{max-height:32vh}
.pic.real{filter:none;animation:unflip .9s ease-out;max-height:min(30vh,340px)}
.pic-wrap.small .pic.real{max-height:26vh}
@keyframes unflip{from{filter:invert(1)}to{filter:invert(0)}}
.kind-chip.pic-chip{background:var(--t12);align-self:flex-start}
.stepper{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:16px;padding:6px}
.stepper button{width:44px;height:44px;padding:0;font-size:24px;line-height:1}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper b{min-width:84px;text-align:center;font-family:var(--display);font-size:24px}
.kind-chip.secret-chip{background:var(--bad)}
.secret-alarm{display:flex;flex-direction:column;gap:22px;border:4px solid var(--bad);border-radius:26px;padding:clamp(18px,3vw,34px);animation:alarm 1s ease-in-out infinite}
.secret-title{font-family:var(--display);color:var(--bad);font-size:clamp(40px,7vw,88px);line-height:1}
@keyframes alarm{0%,100%{box-shadow:0 0 0 0 rgba(255,99,99,0)}50%{box-shadow:0 0 40px 6px rgba(255,99,99,.55)}}
.bz-btn{width:min(72vw,300px);aspect-ratio:1;border-radius:50%;align-self:center;font-family:var(--display);font-size:clamp(44px,13vw,64px);color:#fff;background:radial-gradient(circle at 35% 30%,#ff8a8a,var(--bad) 55%,#b8323a);border:0;box-shadow:0 12px 0 #8c2430,0 18px 40px rgba(255,99,99,.45);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.bz-btn:active{transform:translateY(8px);box-shadow:0 4px 0 #8c2430,0 8px 20px rgba(255,99,99,.45)}
.bz-big{font-size:96px;line-height:1;text-align:center}.bz-big.you{animation:alarm 1s infinite;border-radius:50%}
.bz-who{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;border:3px solid var(--c);border-radius:22px;padding:18px 24px}
.bz-who b{font-family:var(--display);font-size:clamp(34px,5vw,60px);line-height:1;color:var(--c)}
.bz-who button{font-size:24px;padding:14px 26px}.bz-who button small{opacity:.6;font-size:15px}
.bz-yes{background:var(--good);color:var(--on-tile)}.bz-no{background:var(--bad);color:#fff}
.bz-show{font-size:24px;padding:14px 26px}.bz-show small{opacity:.6;font-size:15px}
.bz-ans{font-family:var(--display);font-size:clamp(30px,4.5vw,54px);line-height:1;color:var(--t4);text-align:right}
.bz-paused{font-size:72px;line-height:1;opacity:.6}.delta.none{color:var(--muted)}
.full{width:100%;font-size:20px;padding:18px}
@media (max-width:720px){
  .qwrap{grid-template-columns:1fr}.timer{width:110px;height:110px}.timer b{font-size:38px}
  .pair{grid-template-columns:1fr}.pair .plus{text-align:center}
  .bar{grid-template-columns:2em minmax(0,7em) 1fr 3em;font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ============================================================
   CONNECTION LAYER — the only part tied to Claude hosting.
   To move to your own server, replace createNet() with a
   Socket.IO/Firebase version exposing the same 3 methods:
     set(obj)        publish my state (host: game state, player: name+answer)
     onPeers(fn)     fn([{id, me, data}]) whenever anyone's state changes
     onStatus(fn)    fn(connectedBoolean)
   ============================================================ */
function createNet(code){
  let me = "";
  try { me = sessionStorage.getItem("hpq-peer") || ""; } catch(e){}
  if(!me){ me = Math.random().toString(36).slice(2) + Date.now().toString(36); try { sessionStorage.setItem("hpq-peer", me); } catch(e){} }
  const fns = [], sfns = []; let ws = null, open = false, mine = {}, peers = [];
  function connect(){
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    ws.onopen = () => { open = true; ws.send(JSON.stringify({ t:"join", room:code, id:me, data:mine })); sfns.forEach(f => f(true)); };
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch(err){ return; }
      if(m.t === "peers"){ peers = m.peers.map(p => ({ id:p.id, me:p.id === me, data:p.data || {} })); fns.forEach(f => f(peers)); } };
    ws.onclose = () => { open = false; sfns.forEach(f => f(false)); setTimeout(connect, 1500); };
    ws.onerror = () => { try { ws.close(); } catch(e){} };
  }
  connect();
  return {
    set(obj){ for(const k in obj){ if(obj[k] === null) delete mine[k]; else mine[k] = obj[k]; }
      if(open) ws.send(JSON.stringify({ t:"set", data:obj })); return Promise.resolve(); },
    onPeers(fn){ fns.push(fn); fn(peers); },
    onStatus(fn){ sfns.push(fn); fn(open); }
  };
}

function lev(a, b){
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_, j) => j);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}

function ltTiles(title, lvl, all){
  return `<div class="lt-title">${title.split(" ").map(w => { let k = 0; return `<span class="lt-word">${[...w].map(ch => {
    if(!/[A-Za-z0-9]/.test(ch)) return `<span class="lt-tile punct">${esc(ch)}</span>`;
    const i = k++; return all || i <= lvl ? `<span class="lt-tile ${i === 0 ? "first" : "shown"}">${esc(ch.toUpperCase())}</span>` : `<span class="lt-tile"></span>`;
  }).join("")}</span>`; }).join("")}</div>`;
}
const ltNorm = v => norm(String(v || "").replace(/^\s*(the|a|an)\s+/i, ""));
function ltMatch(guess, q){
  const g = ltNorm(guess); if(g.length < 3) return false;
  const opts = [q.title, q.title.replace(/\s*\([^)]*\)\s*/g, " ").trim()].concat(q.alt || []);
  return opts.some(o => { const a = ltNorm(o); return a && lev(g, a) <= Math.max(1, Math.floor(a.length * .12)); });
}
const whereIs = (n, the, are) => { const v = are ? "are" : "is";
  return /^The /.test(n) ? `Where ${v} the ${n.slice(4)}?` : (the === false || (the === undefined && NO_THE.has(n))) ? `Where ${v} ${n}?` : `Where ${v} the ${n}?`; };

/* ============================================================ start screen */

/* ============================================================ HOST */
const VOTE_SECS = 15;
const NR = () => ROUNDS.filter(r => !r.secret && (r.type !== "pic" || H.picOK)).length;
/* Game length, set by the quizmaster in the lobby: how many rounds, and roughly how many questions in each. */
const NG = () => Math.max(2, Math.min(NR(), H.nRounds || NR()));
const QMIN = 3, QMAX = 10;
// Spin the Letter and Higher or Lower have long turns (a spin, a chain of steps), so they get fewer.
const perFor = r => r.type === "pic" ? H.nQ + 4 : r.type === "letters" || r.type === "hilo" ? Math.max(1, Math.round(H.nQ / 2.5)) : r.secret ? Math.min(7, H.nQ) : H.nQ;
const SECRET_PICK_SECS = 20, SECRET_BONUS = 2, BUZZ_RIGHT = 2, BUZZ_WRONG = 2;
/* Question set: "adult" (default) or "teen" (ages 11–14). Rounds without a teenPool share one set. */
const poolFor = r => H.mode === "teen" && r.teenPool ? r.teenPool : H.mode === "xmas" && r.xmasPool && r.xmasPool.length ? r.xmasPool : r.pool;
const MODES = { adult:"Grown-ups", teen:"Young teens", xmas:"Christmas" };
const H = { net:null, connected:false, gid:"", code:"", ph:"lobby", ri:0, qi:0, endsAt:0, dur:1, scores:{}, answers:{}, players:[], shown:[], reveal:null,
            mode:(MODES[store.get("hpq-mode")] ? store.get("hpq-mode") : "adult"), played:[], qs:[], nRounds:+store.get("hpq-rounds") || 0, nQ:Math.max(QMIN, Math.min(QMAX, +store.get("hpq-nq") || 5)), cats:[], strikes:{}, spinStart:0, spinTo:0, opts:[], votes:{}, tally:{}, tie:false };
const vKey = () => `${H.gid}.v${H.played.length}`;
const curR = () => ROUNDS[H.ri];
const curQ = () => H.qs[H.qi];
const qKey = () => `${H.gid}.${H.ri}.${H.qi}`;

async function startHost(){
  const L = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  H.code = Array.from({length:4}, () => L[Math.floor(Math.random()*L.length)]).join("");
  H.gid = Math.random().toString(36).slice(2, 7);
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch(e){}
  renderHost();
  picCheck();
  H.net = await createNet(H.code);
  if(H.net){
    H.net.onStatus(c => { H.connected = c; renderHost(); });
    H.net.onPeers(hostPeers);
    push();
  }
  renderHost();
  setInterval(hostTick, 250);
  document.addEventListener("keydown", e => { if(e.code === "Space" && e.target === document.body){ e.preventDefault(); next(); }
    if(H.ph === "q" && curR().type === "buzz" && e.target === document.body && (e.key === "r" || e.key === "w")) bzMark(e.key === "r"); });
}

function hostPeers(list){
  const seen = new Set();
  H.players = [];
  for(const p of list){
    const d = p.data;
    if(d.role !== "p" || !d.name) continue;
    const name = String(d.name).slice(0, 16);
    if(!seen.has(name)){ seen.add(name); H.players.push(name); }
    if(!(name in H.scores)) H.scores[name] = 0;
    if(H.ph === "q" && d.a && d.a.k === qKey()){
      if(curR().type === "letters"){ const prev = H.answers[name]; if(!prev || !prev.done) H.answers[name] = { v:d.a.v, t:prev ? prev.t : Date.now(), done:!!d.a.done }; }
      else if(!H.answers[name]) H.answers[name] = { v:d.a.v, t:Date.now(), done:true };
    }
    if(H.ph === "vote" && d.a && d.a.k === vKey() && !(name in H.votes) && H.opts.includes(d.a.v)) H.votes[name] = d.a.v;
    if(H.ph === "secret" && name === H.chooser && d.a && d.a.k === H.gid + ".secret" && H.secretOpts.includes(d.a.v)) H.secretPick = d.a.v;
  }
  if(H.ph === "secret" && H.secretPick){ const c = H.secretPick; H.secretPick = null; pickSecretCat(c); return; }
  if(H.ph === "q" && curR().type === "buzz"){ const was = H.bwas; bzSync(); if(H.bwas !== was) push(); renderHost(); return; }
  if(H.ph === "q" && (curR().type === "hilo" ? hlActive() : H.players).length && (curR().type === "hilo" ? hlActive() : H.players).every(n => H.answers[n] && H.answers[n].done)) doReveal();
  else if(H.ph === "vote" && H.players.length && H.players.every(n => n in H.votes)) resolveVote();
  else renderHost();
}

function shuffled(items){
  let s;
  do { s = items.slice().sort(() => Math.random() - .5); } while(items.length > 1 && s.every((x, i) => x === items[i]));
  return s;
}

function next(){
  if(H.ph === "lobby" || H.ph === "final"){ if(H.ph === "final"){ Object.keys(H.scores).forEach(k => H.scores[k] = 0); H.gid = Math.random().toString(36).slice(2,7); } H.played = []; H.secretDone = false; H.secretAt = 1 + Math.floor(Math.random() * (NG() - 1)); startVote(); return; }
  else if(H.ph === "vote"){ resolveVote(); return; }
  else if(H.ph === "voted") H.ph = "intro";
  else if(H.ph === "intro"){ if(H.picLoading) return; if(!H.qs.length){ H.ph = "board"; push(); renderHost(); return; } startQ(); }
  else if(H.ph === "spin"){ beginLetters(); return; }
  else if(H.ph === "q"){ if(curR().type === "buzz" && bzNow() && !H.bshow){ bzShow(); return; } doReveal(); }
  else if(H.ph === "check"){ finishCheck(); return; }
  else if(H.ph === "reveal"){ let j = H.qi + 1;
    if(curR().type === "hilo" && H.players.length && !hlActive().length){ const c = curQ().chain; while(j < H.qs.length && H.qs[j].chain === c) j++; }
    if(j < H.qs.length){ H.qi = j; startQ(); return; } H.ph = "board"; }
  else if(H.ph === "board"){ if(H.played.length < NG()){ if(maybeSecret()) return; startVote(); return; } H.ph = "final"; }
  else if(H.ph === "secret"){ pickSecretCat(null); return; }
  push(); renderHost();
}

/* ---- Secret Buzzer Round: turns up once per game, after a random round's scoreboard ---- */
function secretCats(){ const r = ROUNDS.find(x => x.secret); return r.cats[H.mode] || r.cats.adult; }
function maybeSecret(){
  if(H.secretDone || !H.players.length) return false;
  if(!H.secretAt) H.secretAt = 1 + Math.floor(Math.random() * (NG() - 1));
  if(H.played.length < H.secretAt) return false;
  H.secretDone = true; H.secretChosen = false;
  // the picker comes from the bottom third of the table (ties broken at random)
  const sc = H.players.map(n => [n, H.scores[n] || 0, Math.random()]).sort((a, b) => a[1] - b[1] || a[2] - b[2]);
  const low = sc.slice(0, Math.max(1, Math.ceil(sc.length / 3))).map(x => x[0]);
  H.chooser = low[Math.floor(Math.random() * low.length)];
  H.secretOpts = Object.keys(secretCats()).sort(() => Math.random() - .5).slice(0, 4);
  H.ph = "secret"; H.dur = SECRET_PICK_SECS * 1000; H.endsAt = Date.now() + H.dur;
  buzzSound(true); push(); renderHost(); return true;
}
function pickSecretCat(cat){
  if(H.ph !== "secret") return;
  H.secretAuto = !H.secretOpts.includes(cat);
  if(H.secretAuto) cat = H.secretOpts[Math.floor(Math.random() * H.secretOpts.length)];
  H.secretCat = cat;
  H.ri = ROUNDS.findIndex(r => r.secret); H.qi = 0;
  H.qs = secretCats()[cat].slice().sort(() => Math.random() - .5).slice(0, perFor(ROUNDS[H.ri]));
  H.ph = "intro"; push(); renderHost();
}
/* Buzzer queue: buzzes in the order the host received them; anyone marked wrong is out for that question. */
const bzQueue = () => Object.keys(H.answers).sort((a, b) => H.answers[a].t - H.answers[b].t);
const bzNow = () => bzQueue().find(n => !H.bout.includes(n)) || null;
function bzSync(){
  const now = bzNow();
  if(now && !H.bwas){ H.bleft = Math.max(0, H.endsAt - Date.now()); buzzSound(false); }   // someone's answering: pause the clock
  if(!now && H.bwas){ H.dur = Math.max(5000, H.bleft); H.endsAt = Date.now() + H.dur; }  // back to buzzing: restart it
  H.bwas = now;
}
function bzMark(right){
  const n = bzNow(); if(H.ph !== "q" || !n || !H.bshow) return;
  if(right){ H.bres[n] = (H.bres[n] || 0) + BUZZ_RIGHT + (n === H.chooser ? SECRET_BONUS : 0); H.bmark[n] = "right"; H.bwas = null; doReveal(); return; }
  H.bres[n] = (H.bres[n] || 0) - BUZZ_WRONG; H.bmark[n] = "wrong"; H.bout.push(n); H.bwas = null; doReveal();
}
function bzShow(){ if(H.ph !== "q" || !bzNow() || H.bshow) return; H.bshow = true; push(); renderHost(); }
/* Buzzer sound made in the browser (the host has already clicked, so sound is allowed). */
function buzzSound(alarm){
  try { const C = window.AudioContext || window.webkitAudioContext; if(!C) return; const ac = H.ac || (H.ac = new C());
    (alarm ? [0, .3, .6] : [0]).forEach((t, i) => { const o = ac.createOscillator(), g = ac.createGain(), at = ac.currentTime + t;
      o.type = "sawtooth"; o.frequency.value = alarm ? (i % 2 ? 330 : 440) : 180;
      g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(.25, at + .02); g.gain.exponentialRampToValueAtTime(.0001, at + (alarm ? .26 : .45));
      o.connect(g).connect(ac.destination); o.start(at); o.stop(at + .5); }); } catch(e){}
}

function startVote(){
  H.opts = ROUNDS.map((_, i) => i).filter(i => !H.played.includes(i) && !ROUNDS[i].secret && (ROUNDS[i].type !== "pic" || H.picOK));
  H.votes = {}; H.tally = {}; H.tie = false;
  if(H.opts.length === 1){ pickRound(H.opts[0]); H.ph = "intro"; push(); renderHost(); return; }
  H.ph = "vote"; H.dur = VOTE_SECS * 1000; H.endsAt = Date.now() + H.dur;
  push(); renderHost();
}
/* ---- Photo Negative: free-licensed lead photos from Wikipedia, looked up live by the TV ---- */
const WIKI = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*";
function picCheck(){
  fetch(WIKI + "&prop=pageimages&piprop=thumbnail&pithumbsize=64&pilicense=free&titles=Mona%20Lisa").then(r => r.json())
    .then(j => { H.picOK = Object.values(j.query.pages).some(p => p.thumbnail); renderHost(); }).catch(() => { H.picOK = false; });
}
async function loadPics(){
  const qs = H.qs.map(q => Object.assign({}, q)), titles = qs.map(q => q.w);
  try {
    const j = await (await fetch(WIKI + "&redirects=1&prop=pageimages&piprop=thumbnail|name&pithumbsize=800&pilicense=free&titles=" + encodeURIComponent(titles.join("|")))).json();
    const to = {}; titles.forEach(t => to[t] = t);
    for(const list of [j.query.normalized || [], j.query.redirects || []]) list.forEach(x => titles.forEach(t => { if(to[t] === x.from) to[t] = x.to; }));
    const pages = {}; Object.values(j.query.pages || {}).forEach(pg => pages[pg.title] = pg);
    qs.forEach(q => { const pg = pages[to[q.w]]; if(pg && pg.thumbnail){ q.img = pg.thumbnail.source; q.file = pg.pageimage; } });
    const files = qs.filter(q => q.file).map(q => "File:" + q.file);
    if(files.length){ try {
      const c = await (await fetch("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=extmetadata&iiextmetadatafilter=Artist|LicenseShortName&titles=" + encodeURIComponent(files.join("|")))).json();
      const plain = h => { const d = document.createElement("div"); d.innerHTML = h || ""; return d.textContent.replace(/\s+/g, " ").trim().slice(0, 80); };
      const cred = {}; Object.values(c.query.pages || {}).forEach(pg => { const m = pg.imageinfo && pg.imageinfo[0].extmetadata; if(m) cred[pg.title.replace(/^File:/, "").replace(/ /g, "_")] = [plain(m.Artist && m.Artist.value), m.LicenseShortName && m.LicenseShortName.value].filter(Boolean).join(", "); });
      qs.forEach(q => { if(q.file) q.credit = cred[q.file.replace(/ /g, "_")] || ""; });
    } catch(e){} }
  } catch(e){}
  const ok = qs.filter(q => q.img).slice(0, H.nQ);
  ok.forEach(q => { const im = new Image(); im.src = q.img; });   // warm the cache so pictures appear instantly
  return ok;
}
function pickRound(i){ H.ri = i; H.qi = 0; H.played.push(i); H.qs = drawQuestions(ROUNDS[i]);
  if(ROUNDS[i].type === "pic"){ H.picLoading = true; loadPics().then(qs => { H.qs = qs; H.picLoading = false; push(); renderHost(); }); } if(ROUNDS[i].type === "hilo") H.qs = hiloSteps(H.qs); }
/* Higher or Lower: each chain of 6 becomes 5 steps (A known, guess B). */
function hiloSteps(chains){ const out = [];
  chains.forEach((c, ci) => c.items.slice(1).forEach((b, k) => out.push({ topic:c.topic, unit:c.unit || "", year:!!c.year, a:c.items[k], b, chain:ci, step:k, steps:c.items.length - 1, last:k === c.items.length - 2 })));
  return out; }
const hlFmt = (v, q) => q.year ? String(v) : Number(v).toLocaleString("en-GB") + (q.unit ? " " + q.unit : "");
const hlActive = () => H.players.filter(n => !(H.out && H.out.has(n)));
/* Random draw each game. Questions already seen on this screen are held back until the pool runs low. */
function drawQuestions(r){
  const pl = poolFor(r), k = "hpq-used2-" + r.id + (pl === r.teenPool ? "-teen" : pl === r.xmasPool ? "-xmas" : "");
  const pool = poolFor(r);
  let used = []; try { used = JSON.parse(store.get(k) || "[]"); } catch(e){}
  let fresh = pool.map((_, i) => i).filter(i => !used.includes(i));
  const n = perFor(r);
  if(fresh.length < n){ used = []; fresh = pool.map((_, i) => i); }
  const pick = fresh.sort(() => Math.random() - .5).slice(0, n);
  store.set(k, JSON.stringify(used.concat(pick)));
  return pick.map(i => pool[i]);
}
function resolveVote(){
  if(H.ph !== "vote") return;
  const t = {}; H.opts.forEach(i => t[i] = 0);
  Object.values(H.votes).forEach(v => t[v]++);
  const top = Math.max(...Object.values(t));
  const leaders = H.opts.filter(i => t[i] === top);
  H.tally = t; H.tie = leaders.length > 1;
  pickRound(leaders[Math.floor(Math.random() * leaders.length)]);
  H.ph = "voted"; push(); renderHost();
}

const SPIN_MS = 4500;
function startQ(){
  H.ph = "q"; H.answers = {}; H.reveal = null; H.bout = []; H.bres = {}; H.bmark = {}; H.bwas = null; H.bshow = false; H.strikes = {}; H.voted = {}; H.chk = []; H.decide = {}; H.checked = false;
  H.shown = curR().type === "order" || curR().type === "odd" ? shuffled(curQ().items) : [];
  if(curR().type === "hilo" && (curQ().step === 0 || !H.out)) H.out = new Set();
  if(curR().type === "letters"){
    const r = curR();
    const fx = H.mode === "teen" ? r.teenFixed : H.mode === "xmas" ? r.xmasFixed : r.fixed, ex = H.mode === "teen" ? r.teenExtras : H.mode === "xmas" ? r.xmasExtras : r.extras;
    H.cats = fx.concat(ex.slice().sort(() => Math.random() - .5).slice(0, 2));
    H.spinTo = 360 * 6 - WHEEL.indexOf(curQ().letter) * (360 / WHEEL.length);
    H.spinStart = Date.now(); H.ph = "spin";
    push(); renderHost(); requestAnimationFrame(spinLoop); return;
  }
  H.dur = curR().secs * 1000; H.endsAt = Date.now() + H.dur;
  push(); renderHost();
}

function spinLoop(){
  if(H.ph !== "spin") return;
  const t = Math.min(1, (Date.now() - H.spinStart) / SPIN_MS);
  const g = $("#wheel-g"); if(g) g.setAttribute("transform", `rotate(${(H.spinTo * (1 - Math.pow(1 - t, 3))).toFixed(2)} 200 200)`);
  if(t < 1) requestAnimationFrame(spinLoop);
  else { const w = $("#wheel-wrap"); if(w) w.classList.add("landed"); setTimeout(beginLetters, 1200); }
}
function beginLetters(){
  if(H.ph !== "spin") return;
  H.ph = "q"; H.dur = curR().secs * 1000; H.endsAt = Date.now() + H.dur;
  push(); renderHost();
}
function wheelSvg(){
  const n = WHEEL.length, seg = 360 / n, R0 = 190, cols = ["--t1","--t2","--t3","--t4","--t5"];
  const pt = (a, r) => [200 + r * Math.sin(a * Math.PI / 180), 200 - r * Math.cos(a * Math.PI / 180)];
  const slices = WHEEL.map((L, i) => {
    const a0 = i * seg - seg / 2, a1 = a0 + seg, [x0, y0] = pt(a0, R0), [x1, y1] = pt(a1, R0), [tx, ty] = pt(i * seg, 150);
    return `<path d="M200 200 L${x0.toFixed(1)} ${y0.toFixed(1)} A${R0} ${R0} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="var(${cols[i % 5]})" stroke="var(--studio)" stroke-width="2"/>
      <text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" transform="rotate(${i * seg} ${tx.toFixed(1)} ${ty.toFixed(1)})" text-anchor="middle" dominant-baseline="central" font-family="var(--display)" font-size="30" fill="var(--on-tile)">${L}</text>`;
  }).join("");
  return `<svg viewBox="0 0 400 420" class="wheel" role="img" aria-label="Letter wheel"><g transform="translate(0 20)"><g id="wheel-g">${slices}<circle cx="200" cy="200" r="34" fill="var(--studio)" stroke="var(--text)" stroke-width="4"/></g></g>
    <polygon points="200,52 184,8 216,8" fill="var(--text)" stroke="var(--studio)" stroke-width="3"/></svg>`;
}
const cleanWord = v => norm(String(v || "").replace(/^\s*(the|a|an)\s+/i, ""));

    names.filter(n => ltMatch(A[n].v, q)).forEach(n => { const t = A[n].t - start; res[n] = t <= H.dur / 3 ? 3 : t <= H.dur * 2 / 3 ? 2 : 1; }); }
  if(r.type === "buzz") Object.assign(res, H.bres);
  if(r.type === "pic"){ const strip = x => String(x || "").replace(/^\s*(the|a|an)\s+/i, "");
    speedRank(n => [q.answer].concat(q.alt || []).some(t => close(strip(A[n].v), strip(t)))); }
  if(r.type === "tf") speedRank(n => A[n].v === (q.answer ? "t" : "f"));
  if(r.type === "hilo"){ const up = q.b.value > q.a.value;
    [...new Set(H.players.concat(names))].forEach(n => { if(H.out.has(n)) return; const a = A[n];
      if(a && (a.v === "h") === up) res[n] = 2 + (q.last ? 3 : 0); else H.out.add(n); }); }
  if(r.type === "order") names.forEach(n => { const v = Array.isArray(A[n].v) ? A[n].v : []; const c = q.items.filter((it, i) => v[i] === it).length; if(c) res[n] = c; });
  if(r.type === "letters") lettersDetail().forEach(c => c.rows.forEach(x => { if(x.pts) res[x.n] = (res[x.n] || 0) + x.pts; }));
  if(r.type === "map"){
    const d = names.map(n => { const v = A[n].v; return [n, Array.isArray(v) && isFinite(v[0]) && isFinite(v[1]) ? km(v, [q.lat, q.lon]) : NaN]; }).filter(x => isFinite(x[1])).sort((a, b) => a[1] - b[1]);
    d.forEach(([n, dist], i) => { const pts = ([3,2,1][i] || 0) + (dist <= 250 ? 2 : 0); if(pts) res[n] = pts; });
  }
  if(r.type === "number"){
    const d = names.map(n => [n, Math.abs(parseFloat(String(A[n].v).replace(/,/g, "")) - q.answer)]).filter(x => isFinite(x[1])).sort((a, b) => a[1] - b[1]);
    let rank = 0, prev = null;
    d.forEach(([n, diff], i) => { if(diff !== prev){ rank = i; prev = diff; } const pts = ([3,2,1][rank] || 0) + (diff === 0 ? 2 : 0); if(pts) res[n] = pts; });
  }
  return res;
}

function answerText(){
  const r = curR(), q = curQ();
  if(r.type === "text") return { main:q.answer, sub:q.parts };
  if(r.type === "pair") return { main:q.answer.map(w => w[0].toUpperCase() + w.slice(1)).join(" "), sub:`${q.c1} / ${q.c2}` };
  if(r.type === "order") return { main:q.items.join(" → "), sub:q.detail || "" };
  if(r.type === "map") return { main:q.place, sub:q.name };
  if(r.type === "letters") return { main:"Letter " + q.letter, sub:"" };
  if(r.type === "odd") return { main:q.items[q.odd], sub:q.why };
  if(r.type === "titles") return { main:q.title, sub:q.artist };
  if(r.type === "tf") return { main:q.answer ? "True" : "False", sub:q.why };
  if(r.type === "buzz") return { main:q.a, sub:"" };
  if(r.type === "pic") return { main:q.answer, sub:"Photo: " + (q.credit || "Wikipedia") + (q.credit ? ", via Wikimedia Commons" : "") };
  if(r.type === "hilo") return { main:`${q.b.name}: ${hlFmt(q.b.value, q)}`, sub:`${q.b.value > q.a.value ? "Higher" : "Lower"} than ${q.a.name} (${hlFmt(q.a.value, q)})` };
  if(r.type === "emoji") return { main:q.answer, sub:q.kind === "song" ? `Song by ${q.by}` : `Film, ${q.year}` };
  return { main:fmtNum(q.answer, q.plain) + (q.unit ? " " + q.unit : ""), sub:"" };
}

function doReveal(){
  if(H.ph !== "q") return;
  if(curR().type === "letters" && !H.checked && startCheck()) return;
  const res = score();
  Object.entries(res).forEach(([n, p]) => H.scores[n] = (H.scores[n] || 0) + p);
  H.reveal = { res, ...answerText() };
  H.ph = "reveal";
  push(); renderHost();
}

function sortedScores(){ return Object.entries(H.scores).sort((a, b) => b[1] - a[1]); }

function publicState(){
  const r = curR(), q = curQ();
  const s = { gid:H.gid, ph:H.ph, ri:H.ri, qi:H.qi, nr:NG(), secret:!!r.secret, chooser:H.chooser || "", cat:H.secretCat || "", nq:H.qs.length, rt:r.type, title:r.title, col:r.color,
              k:qKey(), endsAt:H.endsAt, now:Date.now(), rn:H.played.length };
  if(H.ph === "vote"){ s.k = vKey(); s.opts = H.opts.map(i => ({ i, t:ROUNDS[i].title, b:ROUNDS[i].blurb, c:ROUNDS[i].color })); }
  if(H.ph === "secret"){ s.k = H.gid + ".secret"; s.opts = H.secretOpts; }
  if(H.ph === "voted"){ s.tie = H.tie; s.noVotes = !Object.keys(H.votes).length; }
  if(H.ph === "intro"){ s.rules = r.rules; s.scoring = r.scoring; }
  if(H.ph === "check") s.k = cKey();
  if(H.ph === "q" || H.ph === "reveal" || H.ph === "check"){
    if(r.type === "text") s.q = { clue:q.clue };
    if(r.type === "pair") s.q = { c1:q.c1, c2:q.c2 };
    if(r.type === "order") s.q = { prompt:q.prompt, items:H.shown };
    if(r.type === "odd") s.q = { items:H.shown };
    if(r.type === "tf") s.q = { statement:q.statement };
    if(r.type === "pic") s.q = { img:q.img, kind:q.kind };
    if(r.type === "buzz") s.q = { q:q.q, now:bzNow() || "", out:H.bout, queue:bzQueue() };
    if(r.type === "titles"){ const hn = H.ph === "q" ? ltHint() : { a:true, l:99 }; s.q = { mask:ltMask(q.title, hn.l), artist:hn.a ? q.artist : "" }; }
    if(r.type === "hilo") s.q = { topic:q.topic, a:{ n:q.a.name, v:hlFmt(q.a.value, q) }, b:{ n:q.b.name }, step:q.step, steps:q.steps, out:[...H.out] };
    if(r.type === "number") s.q = { prompt:q.prompt, unit:q.unit || "" };
    if(r.type === "map") s.q = { name:q.name, emoji:q.emoji, the:q.the, are:q.are };
    if(r.type === "letters") s.q = { letter:q.letter, cats:H.cats };
    if(r.type === "emoji") s.q = { emoji:q.emoji, kind:q.kind };
  }
  if(H.ph === "reveal"){ s.rv = { main:H.reveal.main, res:H.reveal.res, mark:H.bmark };
    if(r.type === "letters"){ s.rv.out = {}; Object.keys(H.voted || {}).forEach(k => { if(!H.strikes[k]) return; const [n, ci] = k.split("|"); const a = H.answers[n]; if(a && Array.isArray(a.v)) (s.rv.out[n] = s.rv.out[n] || []).push(String(a.v[+ci] || "").slice(0, 30)); }); }
    if(r.type === "map"){ s.rv.km = {}; Object.entries(H.answers).forEach(([n, a]) => { if(Array.isArray(a.v)) s.rv.km[n] = Math.round(km(a.v, [q.lat, q.lon])); }); } }
  s.sc = sortedScores().slice(0, 20);
  while(JSON.stringify(s).length > 12000 && s.sc.length > 3) s.sc.pop();
  return s;
}
function push(){ if(H.net) H.net.set({ role:"h", s:publicState() }); }

function hostTick(){
  if(H.ph === "q" && curR().type === "titles"){ const hn = ltHint(), key = hn.a + "|" + hn.l; if(key !== H.ltKey){ H.ltKey = key; push(); renderHost(); } }
  if(H.ph === "spin" && Date.now() - H.spinStart > SPIN_MS + 3000) beginLetters();
  if(H.ph !== "q" && H.ph !== "vote" && H.ph !== "secret") return;
  if(H.ph === "q" && curR().type === "buzz" && H.bwas) return;   // clock paused while someone answers
  const left = Math.max(0, H.endsAt - Date.now());
  const el = $("#tleft"), ring = $("#tring");
  if(el) el.textContent = Math.ceil(left / 1000);
  if(ring){ const f = left / H.dur; ring.style.strokeDashoffset = String(440 * (1 - f)); }
  if(left <= 0){ if(H.ph === "q") doReveal(); else if(H.ph === "secret") pickSecretCat(null); else resolveVote(); }
}

    } else if(H.ph === "q"){

      body = `${head}<div class="qwrap"><div class="qcard" style="--c:${c}">${qhtml}</div>

        <div class="answered">${need.filter(n => H.answers[n] && H.answers[n].done).length} / ${need.length} in</div></div></div>
        ${r.type === "hilo" ? "" : `<div class="chips">${H.players.map(n => `<span class="chip ${H.answers[n] && H.answers[n].done ? "done" : "wait"}" style="--c:${colorFor(n)}">${esc(n)}</span>`).join("")}</div>`}`;
      ctrl = "Reveal now";
    } else {
      const rows = H.players.concat(Object.keys(H.answers).filter(n => !H.players.includes(n))).map(n => {
        const a = H.answers[n]; const p = H.reveal.res[n] || 0;
        const said = r.type === "buzz" ? (H.bmark[n] === "right" ? "🔔 Got it" : H.bmark[n] === "wrong" ? "🔔 Wrong" : "Didn’t answer") : !a ? (r.type === "hilo" && H.out.has(n) && !a ? "Out" : "No answer") : r.type === "tf" ? (a.v === "t" ? "True" : "False") : r.type === "odd" ? String(H.shown[a.v] ?? "") : r.type === "hilo" ? (a.v === "h" ? "⬆ Higher" : "⬇ Lower") : r.type === "map" ? (Array.isArray(a.v) ? Math.round(km(a.v, [q.lat, q.lon])).toLocaleString("en-GB") + " km away" : "No pin") : Array.isArray(a.v) ? a.v.join(r.type === "order" ? ", " : " ") : a.v;
        return `<div class="res"><div style="min-width:0"><div class="who">${esc(n)}</div><div class="what">${esc(said)}</div></div><div class="pts ${p > 0 ? "" : p < 0 ? "neg" : "zero"}">${p < 0 ? "−" + -p : "+" + p}</div></div>`;
      }).join("");
      const mapReveal = r.type === "map" ? `<div class="host-map">${mapSvg(FULL, Object.entries(H.answers).filter(([, a]) => Array.isArray(a.v)).map(([n, a]) => `<line x1="${toXY(a.v[0], a.v[1])[0]}" y1="${toXY(a.v[0], a.v[1])[1]}" x2="${toXY(q.lat, q.lon)[0]}" y2="${toXY(q.lat, q.lon)[1]}" stroke="${colorFor(n)}" stroke-width=".5" stroke-dasharray="1.5 1.5"/>`).join("") + Object.entries(H.answers).filter(([, a]) => Array.isArray(a.v)).map(([n, a]) => pin(a.v[0], a.v[1], colorFor(n), 360, n)).join("") + star(q.lat, q.lon, 360))}</div>` : "";
      const cardReveal = r.type === "odd" || r.type === "hilo" || r.type === "tf" || r.type === "titles" || r.type === "buzz" || r.type === "pic" ? `<div class="qcard" style="--c:${c}">${qhtml}</div>` : "";
      body = `${head}${mapReveal}${cardReveal}<div class="stack" style="gap:8px"><div class="label">The answer</div><div class="reveal-ans" style="--c:${c}">${esc(H.reveal.main)}</div>${H.reveal.sub ? `<div class="reveal-sub">${esc(H.reveal.sub)}</div>` : ""}</div>
        <div class="results">${rows}</div>`;
      if(r.type === "letters"){

        const tot = H.players.concat(Object.keys(H.answers).filter(n => !H.players.includes(n))).map(n => { const p = H.reveal.res[n] || 0;

        body = `${head}<div class="row" style="gap:20px;align-items:center"><div class="letter-tile small">${esc(q.letter)}</div><p class="reveal-sub" style="margin:0;flex:1;min-width:220px">Unique answers score 2, shared answers 1. ✓ means it’s on our word list. Crossed-out answers weren’t accepted. Tap any answer to strike it or put it back.</p></div>
          <div class="cat-grid">${det.map((cg, ci) => `<div class="cat"><div class="label">${esc(cg.cat)}</div><div class="ans-list">${cg.rows.map(x => `<button type="button" class="ans ${x.struck ? "struck" : !x.ok ? "bad" : x.pts === 2 ? "uniq" : "shared"}" data-k="${esc(x.n + "|" + ci)}" style="--c:${colorFor(x.n)}" ${x.ok || x.struck ? "" : "disabled"}><span class="aw">${x.auto && !x.struck ? "✓ " : ""}${esc(x.raw)}</span><small>${esc(x.n)}${x.struck ? (x.voted === "rejected" ? " · rejected" : x.voted ? " · not checked" : " · struck by gamemaster") : !x.ok ? " · wrong letter" : ""}</small><em>${x.pts ? "+" + x.pts : "0"}</em></button>`).join("") || `<span class="reveal-sub" style="font-size:15px">No answers</span>`}</div></div>`).join("")}</div>
          <div class="results">${tot}</div>`;
      }
      ctrl = H.qi < H.qs.length - 1 ? (r.type === "letters" ? "Spin again" : "Next question") : "Scores";
    }
  }
  if(H.ph === "board"){
    const sc = sortedScores(), top = Math.max(1, ...sc.map(s => s[1]));
    body = `<div class="round-no">After round ${H.played.length} of ${NG()}</div><h2 style="font-size:clamp(36px,5vw,60px)">Scores</h2>
      <div class="board">${sc.map(([n, p], i) => `<div class="bar" style="--c:${colorFor(n)}"><span class="pos">${i + 1}</span><span class="nm">${esc(n)}</span><div class="track"><div class="fill" style="width:${(Math.max(0, p) / top * 100).toFixed(1)}%"></div></div><span class="sc">${p}</span></div>`).join("") || `<p class="reveal-sub">No players yet.</p>`}</div>`;
    ctrl = H.played.length < NG() - 1 ? "Vote for the next round" : H.played.length < NG() ? "Final round" : "Final results";
  }
  if(H.ph === "final"){
    const sc = sortedScores(); const [a, b, d] = sc;
    const pod = (e, cls) => e ? `<div class="pod ${cls}"><b>${esc(e[0])}</b><span>${e[1]} pts</span></div>` : `<div></div>`;
    body = `<h1 class="intro-title" style="--c:var(--t4)">${a ? esc(a[0]) + " wins!" : "Game over"}</h1>
      <div class="podium">${pod(b, "p2")}${pod(a, "p1")}${pod(d, "p3")}</div>
      ${sc.length > 3 ? `<div class="reveal-sub">${sc.slice(3).map(([n, p], i) => `${i + 4}. ${esc(n)} ${p}`).join(" · ")}</div>` : ""}`;
    ctrl = "Play again";
  }

    <div class="hbar"><div class="logo" style="font-size:28px"><span>House</span> <span>Party</span> <span>Quiz</span></div>

    ${status}
    <div class="stage">${body}</div>
    <div class="controls"><span class="label">Space bar = next</span>
      <div class="row">${H.ph !== "lobby" && H.ph !== "final" ? `<button class="ghost" id="h-end">End game</button>` : ""}<button id="h-next" ${H.ph === "lobby" && !H.players.length && H.net ? "disabled" : ""}>${esc(ctrl)}</button></div></div>`;
  $("#h-next").onclick = next;
  const setMode = m => { H.mode = m; store.set("hpq-mode", m); renderHost(); };
  const setLen = (r, q) => { H.nRounds = Math.max(2, Math.min(NR(), r)); H.nQ = Math.max(QMIN, Math.min(QMAX, q)); store.set("hpq-rounds", String(H.nRounds)); store.set("hpq-nq", String(H.nQ)); renderHost(); };
  if($("#r-dn")){ $("#r-dn").onclick = () => setLen(NG() - 1, H.nQ); $("#r-up").onclick = () => setLen(NG() + 1, H.nQ); $("#q-dn").onclick = () => setLen(NG(), H.nQ - 1); $("#q-up").onclick = () => setLen(NG(), H.nQ + 1); }
  if($("#m-adult")){ $("#m-adult").onclick = () => setMode("adult"); $("#m-teen").onclick = () => setMode("teen"); $("#m-xmas").onclick = () => setMode("xmas"); }
  document.body.classList.toggle("xmas", H.mode === "xmas");
  document.querySelectorAll(".ans[data-k]").forEach(b => b.onclick = () => toggleStrike(b.dataset.k));
  document.querySelectorAll(".gm-yes, .gm-no").forEach(b => b.onclick = () => { const i = +b.dataset.i, v = b.classList.contains("gm-yes"); H.decide[i] = H.decide[i] === v ? undefined : v; renderHost(); });
  if($("#gm-all")) $("#gm-all").onclick = () => { H.chk.forEach(it => { if(H.decide[it.i] === undefined) H.decide[it.i] = true; }); renderHost(); };
  if(H.ph === "spin") requestAnimationFrame(spinLoop);
  if($("#bz-show")) $("#bz-show").onclick = bzShow;
  if($("#bz-yes")){ $("#bz-yes").onclick = () => bzMark(true); $("#bz-no").onclick = () => bzMark(false); }
  const end = $("#h-end"); if(end) end.onclick = () => { H.ph = "final"; push(); renderHost(); };
}

/* ============================================================ PLAYER */
const P = { net:null, name:"", code:"", s:null, sJSON:"", localEnd:0, sent:null, pick:[], view:"", connected:false };

function renderJoin(err){
  app.innerHTML = `<div class="phone"><div class="logo" style="font-size:36px"><span>House</span> <span>Party</span> <span>Quiz</span></div>
    <form class="pmain" id="jf" style="justify-content:flex-start">
      <label class="stack" style="gap:6px"><span class="label">Room code</span><input id="j-code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" style="font-family:var(--mono);letter-spacing:.3em;text-transform:uppercase"></label>
      <label class="stack" style="gap:6px"><span class="label">Your name</span><input id="j-name" maxlength="14" autocomplete="nickname" placeholder="e.g. Chris"></label>
      ${err ? `<div class="banner" style="color:var(--bad)">${esc(err)}</div>` : ""}
      <button class="full" type="submit">Join</button>
      <button class="ghost" type="button" id="j-back">Back</button>
    </form></div>`;
  $("#j-name").value = store.get("hpq-name") || "";
  $("#jf").onsubmit = e => { e.preventDefault(); joinGame(); };
  $("#j-back").onclick = renderStart;
  $("#j-code").focus();
}

async function joinGame(){
  const code = $("#j-code").value.trim().toUpperCase().replace(/[^A-Z]/g, "");
  const name = $("#j-name").value.trim().replace(/\s+/g, " ").slice(0, 14);
  if(code.length !== 4) return renderJoin("The room code is 4 letters, shown on the big screen.");
  if(!name) return renderJoin("Add a name so the host knows who you are.");
  store.set("hpq-name", name);
  P.code = code; P.name = name;
  app.innerHTML = `<div class="phone"><div class="pmain"><div class="big-msg">Joining ${esc(code)}…</div></div></div>`;
  P.net = await createNet(code);
  if(!P.net) return renderJoin("Can’t reach the game server. Check your connection and try again.");
  P.net.onStatus(c => { P.connected = c; });
  P.net.set({ role:"p", name:P.name, a:null });
  P.net.onPeers(playerPeers);
  setInterval(playerTick, 250);
  renderPlayer(true);
}

function playerPeers(list){
  const host = list.find(p => p.data.role === "h" && p.data.s);
  const s = host ? host.data.s : null;
  const j = JSON.stringify(s);
  if(j === P.sJSON) return;
  P.sJSON = j; P.s = s;
  if(s && (s.ph === "q" || s.ph === "vote" || s.ph === "secret")) P.localEnd = Date.now() + (s.endsAt - s.now);
  renderPlayer();
}

function playerTick(){
  const el = $("#ptl"); if(!el) return;
  el.textContent = Math.max(0, Math.ceil((P.localEnd - Date.now()) / 1000)) + "s";
}

function submit(v){
  if(!P.s || (P.s.ph !== "q" && P.s.ph !== "vote")) return;
  P.sent = P.s.k;
  P.net.set({ role:"p", name:P.name, a:{ k:P.s.k, v, done:true } });
  renderPlayer(true);
}

function myScore(){ const s = P.s; if(!s) return 0; const e = (s.sc || []).find(x => x[0] === P.name); return e ? e[1] : 0; }

function renderPlayer(force){
  const s = P.s;
  const view = !s ? "wait" : `${s.ph}|${s.k}|${P.sent === s.k}|${s.rv && s.rv.res ? (s.rv.res[P.name] || 0) : ""}|${s.rt === "buzz" && s.q ? s.q.now + "/" + (s.q.out || []).join(",") + "/" + (s.q.queue || []).indexOf(P.name) : ""}`;
  if(!force && view === P.view){ const ps = $("#pscore"); if(ps) ps.textContent = myScore() + " pts";
    if(s && s.rt === "titles" && s.ph === "q" && s.q){ const mk = $(".lt-mask"); if(mk && mk.textContent !== s.q.mask){ mk.textContent = s.q.mask; }
      if(s.q.artist && mk && !mk.nextElementSibling){ const d = document.createElement("div"); d.innerHTML = "Artist: <b></b>"; d.querySelector("b").textContent = s.q.artist; mk.after(d); } }
    return; }
  P.view = view;
  let main = "";
  if(!s) main = `<div class="big-msg">You’re in!</div><p class="reveal-sub" style="margin:0">Waiting for the host to start. Watch the big screen.</p>`;

  else if(s.ph === "secret" && s.chooser === P.name && P.sent !== s.k) main = `<div class="secret-title" style="font-size:clamp(26px,8vw,40px)">🚨 SECRET ROUND</div><div class="big-msg">You pick the category!</div>
      <p style="margin:0">It’s a buzzer round. Get questions right for <b>+${SECRET_BONUS} extra</b> each.</p><span class="ptimer" id="ptl"></span>
      <div class="pvote">${(s.opts || []).map((x, i) => `<button type="button" class="psec" data-c="${i}" style="--c:var(--bad)"><b>${esc(x)}</b></button>`).join("")}</div>`;
  else if(s.ph === "secret") main = `<div class="secret-title" style="font-size:clamp(26px,8vw,40px)">🚨 SECRET ROUND</div><div class="big-msg">${s.chooser === P.name ? "Category picked!" : esc(s.chooser) + " is choosing a category…"}</div><p class="reveal-sub" style="margin:0">Get ready to buzz. Watch the big screen.</p>`;
  else if(s.ph === "vote" && P.sent === s.k) main = `<div class="big-msg">Vote cast</div><p class="reveal-sub" style="margin:0">Watch the big screen for the result.</p>`;
  else if(s.ph === "vote") main = `<div class="row" style="justify-content:space-between"><span class="label">Round ${s.rn + 1} of ${s.nr}</span><span class="ptimer" id="ptl"></span></div>
      <div class="big-msg">Pick the next round</div>
      <div class="pvote">${(s.opts || []).map(o => `<button type="button" data-v="${o.i}" style="--c:var(${o.c})"><b>${esc(o.t)}</b><span>${esc(o.b)}</span></button>`).join("")}</div>`;
  else if(s.ph === "voted") main = `<div class="label">${s.noVotes ? "Picked at random" : s.tie ? "Tie! Picked at random" : "Next round"}</div><div class="big-msg" style="color:var(${s.col})">${esc(s.title)}</div>`;
  else if(s.ph === "intro" && s.secret) main = `<div class="secret-title" style="font-size:clamp(26px,8vw,40px)">🚨 BUZZER ROUND</div><div class="big-msg" style="color:var(--bad)">${esc(s.cat)}</div>
      <p style="margin:0">Your phone becomes a buzzer. Only the first to buzz answers, and they get one guess. Right <b>+${BUZZ_RIGHT}</b>, wrong <b>−${BUZZ_WRONG}</b>.${s.chooser === P.name ? ` You picked this, so you get <b>+${SECRET_BONUS} extra</b> for each right answer!` : ""}</p>`;
  else if(s.ph === "intro") main = `<div class="label">Round ${s.rn} of ${s.nr}</div><div class="big-msg" style="color:var(${s.col})">${esc(s.title)}</div><p style="margin:0">${esc(s.rules)}</p>`;
  else if(s.ph === "spin") main = `<div class="label" style="color:var(${s.col})">${esc(s.title)}</div><div class="big-msg">The wheel is spinning…</div><p class="reveal-sub" style="margin:0">Watch the big screen. Your list appears here when it stops.</p>`;
  else if(s.ph === "check") main = `<div class="label" style="color:var(${s.col})">${esc(s.title)}</div><div class="big-msg">The gamemaster is checking answers…</div><p class="reveal-sub" style="margin:0">Watch the big screen.</p>`;
  else if(s.ph === "q" && s.rt === "buzz"){ const q = s.q || {}, out = (q.out || []).includes(P.name), inQ = (q.queue || []).includes(P.name);
    main = q.now === P.name ? `<div class="bz-big you">🔔</div><div class="big-msg">You’re first!</div><p style="margin:0;font-size:20px">Say your answer out loud. One guess only!</p>`
      : out ? `<div class="big-msg">Wrong answer</div><p class="reveal-sub" style="margin:0">You’re out for this question. −${BUZZ_WRONG} point.</p>`
      : q.now ? `<div class="big-msg">${esc(q.now)} buzzed first</div><p class="reveal-sub" style="margin:0">${inQ ? "Just too slow!" : "They get one guess. Watch the big screen."}</p>`
      : P.sent === s.k || inQ ? `<div class="bz-big">⏳</div><div class="big-msg">Buzzed!</div>`
      : `<div class="pclue" style="font-size:18px">${esc(q.q || "")}</div><button type="button" class="bz-btn" id="bz">BUZZ</button>`; }
  else if(s.ph === "q" && P.sent === s.k) main = `<div class="big-msg">Locked in</div><p class="reveal-sub" style="margin:0">Eyes on the big screen.</p>`;
  else if(s.ph === "q"){
    const q = s.q || {};
    const top = `<div class="row" style="justify-content:space-between"><span class="label" style="color:var(${s.col})">${esc(s.title)} · Q${s.qi + 1}</span><span class="ptimer" id="ptl"></span></div>`;

    if(s.rt === "hilo") main = (q.out || []).includes(P.name)
      ? `<div class="big-msg">You’re out of this chain</div><p class="reveal-sub" style="margin:0">You’ll be back in for the next one. Watch the big screen.</p>`
      : `${top}<div class="label">${esc(q.topic)} · step ${q.step + 1} of ${q.steps}</div>
      <div class="pclue stack" style="gap:2px"><b>${esc(q.a.n)}</b><span style="font-family:var(--display);font-size:28px">${esc(q.a.v)}</span></div>
      <p style="margin:0;font-size:19px">Is <b>${esc(q.b.n)}</b> higher or lower?</p>
      <div class="phl"><button type="button" data-v="h">⬆ Higher</button><button type="button" data-v="l">⬇ Lower</button></div>`;
    if(s.rt === "order"){ P.pick = []; main = `${top}<div class="pclue">${esc(q.prompt)}. Tap in order.</div><div class="pick" id="pick"></div>
      <div class="row"><button class="ghost" id="preset" type="button">Reset</button><button id="plock" type="button" style="flex:1" disabled>Lock in</button></div>`; }
    if(s.rt === "map"){ P.map = { vb:null, pin:null };
      main = `${top}<div class="pclue">${esc(whereIs(q.name, q.the, q.are))} ${q.emoji || ""}</div>
      <div class="pmap" id="pmap"><div class="pmap-ctl"><button type="button" id="pz-in" aria-label="Zoom in">+</button><button type="button" id="pz-out" aria-label="Zoom out">−</button><button type="button" id="pz-all" aria-label="Show whole world">🌍</button></div></div>
      <div class="pmap-hint" id="phint">Pinch or use + to zoom, drag to move. Tap to drop your pin.</div>
      <button id="plock" class="full" type="button" disabled>Drop a pin first</button>`; }
    if(s.rt === "emoji") main = `${top}<div class="pclue stack" style="gap:8px;align-items:flex-start"><span class="kind-chip small">${q.kind === "song" ? "🎵 Song" : "🎬 Film"}</span><div style="font-size:44px;line-height:1.15;letter-spacing:.06em">${q.emoji}</div></div>
      <form id="pf" class="stack"><input id="pa" autocomplete="off" autocapitalize="words" placeholder="${q.kind === "song" ? "Song title" : "Film title"}"><button class="full" type="submit">Lock in</button></form>`;
    if(s.rt === "letters") main = `${top}<div class="row" style="gap:14px"><div class="plet">${esc(q.letter)}</div><p style="margin:0;flex:1;min-width:0">Everything starts with <b>${esc(q.letter)}</b>. Fill in what you can.</p></div>
      <form id="pf" class="stack">${(q.cats || []).map((x, i) => `<label class="stack" style="gap:4px"><span class="label">${esc(x)}</span><input id="pl${i}" autocomplete="off" autocapitalize="words" placeholder="${esc(q.letter)}…"></label>`).join("")}<button class="full" type="submit">Lock in</button></form>`;
    if(s.rt === "number") main = `${top}<div class="pclue">${esc(q.prompt)}${q.unit ? ` (${esc(q.unit)})` : ""}</div>
      <form id="pf" class="stack"><input id="pa" inputmode="decimal" autocomplete="off" placeholder="Your guess"><button class="full" type="submit">Lock in</button></form>`;
  }
  else if(s.ph === "reveal"){
    const d = s.rv && s.rv.res ? (s.rv.res[P.name] || 0) : 0;
    main = `${s.rt === "pic" && s.q && s.q.img ? `<div class="pic-wrap small"><img class="pic real" src="${esc(s.q.img)}" alt="${esc(s.rv ? s.rv.main : "")}"></div>` : ""}<div class="label">The answer</div><div class="big-msg" style="color:var(${s.col})">${esc(s.rv ? s.rv.main : "")}</div>
      <div class="delta ${d > 0 ? "good" : d < 0 ? "bad" : "none"}">${d < 0 ? "−" + -d : "+" + d}</div>${s.rv && s.rv.km && P.name in s.rv.km ? `<div class="pclue">Your pin was ${s.rv.km[P.name].toLocaleString("en-GB")} km away</div>` : ""}${s.rv && s.rv.out && s.rv.out[P.name] ? `<div class="pclue">Not accepted: ${esc(s.rv.out[P.name].join(", "))}</div>` : ""}<p class="reveal-sub" style="margin:0">${d > 0 ? "Nice one." : d < 0 ? "Ouch." : s.rt === "buzz" ? "Not this time." : P.sent === s.k ? "Not this time." : "No answer sent."}</p>`;
  }
  else if(s.ph === "board"){
    const pos = (s.sc || []).findIndex(x => x[0] === P.name);
    main = `<div class="label">After round ${s.rn}</div><div class="big-msg">${pos >= 0 ? "You’re " + ordinal(pos + 1) : "Scores are up"}</div><p class="reveal-sub" style="margin:0">Check the big screen.</p>`;
  }
  else if(s.ph === "final"){
    const pos = (s.sc || []).findIndex(x => x[0] === P.name);
    main = `<div class="big-msg">${pos === 0 ? "You won!" : pos >= 0 ? "You came " + ordinal(pos + 1) : "Game over"}</div><p class="reveal-sub" style="margin:0">${myScore()} points. Thanks for playing.</p>`;
  }
  app.innerHTML = `<div class="phone"><div class="ptop"><span class="me" style="--c:${colorFor(P.name)}">${esc(P.name)}</span><span class="pscore" id="pscore">${myScore()} pts</span></div><div class="pmain">${main}</div></div>`;
  const pf = $("#pf");
  if(pf && s.rt === "letters"){
    const vals = () => s.q.cats.map((_, i) => ($("#pl" + i).value || "").trim().slice(0, 30));
    let tmr = null;
    pf.oninput = () => { clearTimeout(tmr); tmr = setTimeout(() => { if(P.s && P.s.ph === "q" && P.sent !== s.k) P.net.set({ role:"p", name:P.name, a:{ k:s.k, v:vals(), done:false } }); }, 400); };
    pf.onsubmit = e => { e.preventDefault(); clearTimeout(tmr); submit(vals()); };
    $("#pl0").focus();
  }
  else if(pf){ pf.onsubmit = e => { e.preventDefault(); const a = $("#pa").value.trim(); const b = $("#pb");
      if(s.rt === "pair"){ if(!a || !b.value.trim()) return; submit([a.slice(0, 40), b.value.trim().slice(0, 40)]); }
      else { if(!a) return; submit(a.slice(0, 60)); } };
    $("#pa").focus(); }
  if($("#pick")) drawPick();
  if($("#pmap")) drawPMap();
  document.querySelectorAll(".pvote button").forEach(b => b.onclick = () => submit(+b.dataset.v));
  document.querySelectorAll(".podd button").forEach(b => b.onclick = () => submit(+b.dataset.v));
  if($("#bz")) $("#bz").onpointerdown = e => { e.preventDefault(); if(navigator.vibrate) navigator.vibrate(60); submit(true); };
  document.querySelectorAll(".psec").forEach(b => b.onclick = () => { const x = (s.opts || [])[+b.dataset.c]; if(!x) return; P.sent = s.k; P.net.set({ role:"p", name:P.name, a:{ k:s.k, v:x, done:true } }); renderPlayer(true); });
  document.querySelectorAll(".phl button").forEach(b => b.onclick = () => submit(b.dataset.v));
  playerTick();
}

function drawPick(){
  const items = (P.s.q && P.s.q.items) || [];
  $("#pick").innerHTML = items.map((it, i) => { const at = P.pick.indexOf(it);
    return `<button type="button" data-i="${i}" class="${at >= 0 ? "sel" : ""}"><span class="n">${at >= 0 ? at + 1 : ""}</span>${esc(it)}</button>`; }).join("");
  $("#pick").querySelectorAll("button").forEach(b => b.onclick = () => { const it = items[+b.dataset.i]; if(!P.pick.includes(it)) P.pick.push(it); drawPick(); });
  $("#plock").disabled = P.pick.length !== items.length;
  $("#plock").onclick = () => submit(P.pick.slice());
  $("#preset").onclick = () => { P.pick = []; drawPick(); };
}
/* Phone map: pinch/drag/wheel to zoom and pan, tap to drop or move the pin. viewBox units = degrees. */
function drawPMap(){
  const m = P.map, box = $("#pmap");
  box.insertAdjacentHTML("afterbegin", `<svg id="pmsvg" class="map" preserveAspectRatio="xMidYMid meet" role="img" aria-label="World map. Tap to drop your pin.">
    <rect x="-400" y="-400" width="1200" height="1000" fill="var(--sea)"/>
    <path d="${LAND}" fill="var(--land)" stroke="var(--land-edge)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <path d="${BORDERS}" fill="none" stroke="var(--land-edge)" stroke-opacity=".8" stroke-width=".8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <g id="ppin" style="display:none"><circle id="ppin-halo" fill="${colorFor(P.name)}" fill-opacity=".25"/><circle id="ppin-dot" fill="${colorFor(P.name)}" stroke="var(--studio)" vector-effect="non-scaling-stroke" stroke-width="3"/></g></svg>`);
  const svg = $("#pmsvg");
  const size = () => [box.clientWidth || 1, box.clientHeight || 1];
  const MINW = 4, TOP = 6, BOT = 150;
  const clamp = v => {
    const [cw, ch] = size(), asp = cw / ch;
    let w = Math.min(360, Math.max(MINW, v[2])), h = w / asp;
    let x = Math.min(360 - w, Math.max(0, v[0]));
    let y = h >= BOT - TOP ? (TOP + BOT) / 2 - h / 2 : Math.min(BOT - h, Math.max(TOP, v[1]));
    return [x, y, w, h];
  };
  const apply = () => {
    m.vb = clamp(m.vb); svg.setAttribute("viewBox", m.vb.join(" "));
    const px = m.vb[2] / size()[0], g = $("#ppin");
    if(m.pin){ const [x, y] = toXY(m.pin[0], m.pin[1]); g.style.display = "";
      $("#ppin-dot").setAttribute("cx", x); $("#ppin-dot").setAttribute("cy", y); $("#ppin-dot").setAttribute("r", 7 * px);
      $("#ppin-halo").setAttribute("cx", x); $("#ppin-halo").setAttribute("cy", y); $("#ppin-halo").setAttribute("r", 18 * px); }
    else g.style.display = "none";
    $("#pz-in").disabled = m.vb[2] <= MINW + .01; $("#pz-out").disabled = $("#pz-all").disabled = m.vb[2] >= 359.9;
    $("#plock").disabled = !m.pin; $("#plock").textContent = m.pin ? "Lock in" : "Drop a pin first";
    $("#phint").textContent = m.pin ? "Happy? Lock in. Or tap somewhere else to move your pin." : "Pinch or use + to zoom, drag to move. Tap to drop your pin.";
  };
  const toMap = (cx, cy) => { const r = svg.getBoundingClientRect(); return [m.vb[0] + (cx - r.left) / r.width * m.vb[2], m.vb[1] + (cy - r.top) / r.height * m.vb[3]]; };
  const zoomAt = (f, cx, cy) => { const [mx, my] = toMap(cx, cy), w = Math.min(360, Math.max(MINW, m.vb[2] * f)), k = w / m.vb[2];
    m.vb = [mx - (mx - m.vb[0]) * k, my - (my - m.vb[1]) * k, w, m.vb[3] * k]; apply(); };
  const zoomMid = f => { const r = svg.getBoundingClientRect(); zoomAt(f, r.left + r.width / 2, r.top + r.height / 2); };
  const home = () => { const [cw, ch] = size(), w = Math.min(360, (BOT - TOP) * cw / ch); return [190 - w / 2, TOP, w, 0]; };
  m.vb = m.vb || home(); apply();
  // pointer gestures
  const pts = new Map(); let g0 = null, moved = false, downAt = 0;
  const start = () => { const a = [...pts.values()];
    if(a.length === 1) g0 = { x:a[0].x, y:a[0].y, vb:m.vb.slice() };
    else if(a.length === 2) g0 = { d:Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), mx:(a[0].x + a[1].x) / 2, my:(a[0].y + a[1].y) / 2, vb:m.vb.slice() }; };
  svg.addEventListener("pointerdown", e => { svg.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x:e.clientX, y:e.clientY }); if(pts.size === 1){ moved = false; downAt = Date.now(); } else moved = true; start(); });
  svg.addEventListener("pointermove", e => {
    if(!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    const a = [...pts.values()], r = svg.getBoundingClientRect(), per = g0.vb[2] / r.width;
    if(a.length === 1 && g0.x !== undefined){ const dx = a[0].x - g0.x, dy = a[0].y - g0.y;
      if(Math.hypot(dx, dy) > 8) moved = true;
      if(moved){ m.vb = [g0.vb[0] - dx * per, g0.vb[1] - dy * per, g0.vb[2], g0.vb[3]]; apply(); } }
    else if(a.length === 2 && g0.d){ const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), mx = (a[0].x + a[1].x) / 2, my = (a[0].y + a[1].y) / 2;
      const w = Math.min(360, Math.max(MINW, g0.vb[2] * g0.d / Math.max(d, 1))), k = w / g0.vb[2];
      const ax = g0.vb[0] + (g0.mx - r.left) * per, ay = g0.vb[1] + (g0.my - r.top) * per;
      m.vb = [ax - (mx - r.left) * per * k, ay - (my - r.top) * per * k, w, g0.vb[3] * k]; apply(); }
  });
  const end = e => { if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
    if(!pts.size && !moved && Date.now() - downAt < 600){ const [x, y] = toMap(e.clientX, e.clientY);
      if(y >= TOP - 2 && y <= BOT + 2){ m.pin = [+(90 - Math.min(BOT, Math.max(TOP, y))).toFixed(3), +(Math.min(360, Math.max(0, x)) - 180).toFixed(3)]; apply(); } }
    if(pts.size) start(); };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", e => { moved = true; end(e); });
  svg.addEventListener("wheel", e => { e.preventDefault(); zoomAt(Math.exp(e.deltaY * .0015), e.clientX, e.clientY); }, { passive:false });
  $("#pz-in").onclick = () => zoomMid(.5); $("#pz-out").onclick = () => zoomMid(2); $("#pz-all").onclick = () => { m.vb = [0, 0, 360, 0]; apply(); };
  $("#plock").onclick = () => { if(m.pin) submit(m.pin); };
  if(window.ResizeObserver) new ResizeObserver(() => { if(document.body.contains(svg)) apply(); }).observe(box);
}
const ordinal = n => n + (["th","st","nd","rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)] || "th");

/* ============================================================ boot */
if(location.hash === "#play") renderJoin(); else renderStart();
</script>
