<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A party quiz for your telly. Phones join with a room code.">
<title>House Party Quiz</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Layout: one-screen game show stage. Host = header / stage / control bar. Phone = single column controller. Deliberate single dark "studio" look. */
:root{
  --studio:#15112e; --panel:#221c4a; --panel-2:#2c2560; --line:#40378a;
  --text:#f7f4ff; --muted:#b4acdf;
  --t1:#ff7a2f; --t2:#14c4b0; --t3:#ff4f9a; --t4:#ffd23f; --t5:#8e9bff; --t6:#b5e655;
  --sea:#1d3a63; --land:#3f8f6b; --land-edge:#5fb88f;
  --good:#40e08a; --bad:#ff6363; --on-tile:#15112e;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--studio);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(ellipse at 50% -20%,var(--panel-2) 0%,transparent 60%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#app{min-height:100%;display:flex;flex-direction:column;max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 22px;font-weight:700;color:var(--on-tile);background:var(--t4);
  box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
button:focus-visible,input:focus-visible{outline:3px solid var(--t2);outline-offset:3px}
button.ghost{background:transparent;color:var(--text);box-shadow:none;border:2px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
input{font:inherit;font-size:20px;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--text)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.banner{background:var(--panel);border:2px dashed var(--line);border-radius:14px;padding:12px 16px;color:var(--muted);font-size:14px}

/* start */
.start{flex:1;display:grid;place-items:center;padding-block:32px}
.start-inner{max-width:720px;width:100%;display:flex;flex-direction:column;gap:28px}
.logo{font-family:var(--display);font-size:clamp(44px,9vw,96px);line-height:.92}
.logo span:nth-child(1){color:var(--t1)}.logo span:nth-child(2){color:var(--t2)}.logo span:nth-child(3){color:var(--t4)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.choice{text-align:left;padding:22px;border-radius:20px;display:flex;flex-direction:column;gap:6px}
.choice b{font-family:var(--display);font-weight:400;font-size:26px}
.choice span{font-weight:500;font-size:15px;opacity:.85}
.c-host{background:var(--t2)}.c-join{background:var(--t3)}
.rounds-preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rp{border-radius:14px;padding:12px 14px;background:var(--panel);border-left:6px solid var(--c)}
.rp b{display:block;font-size:15px}.rp small{color:var(--muted);font-size:13px}

/* host stage */
.hbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:16px;flex-wrap:wrap}
.code-chip{font-family:var(--mono);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:18px;letter-spacing:.2em}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding-block:12px 24px;min-height:0}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px max(16px,env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);flex-wrap:wrap}
.code-big{display:flex;gap:12px;flex-wrap:wrap}
.code-big div{font-family:var(--display);font-size:clamp(56px,10vw,120px);width:1.25em;height:1.35em;display:grid;place-items:center;border-radius:18px;color:var(--on-tile)}
.code-big div:nth-child(1){background:var(--t1)}.code-big div:nth-child(2){background:var(--t2)}.code-big div:nth-child(3){background:var(--t3)}.code-big div:nth-child(4){background:var(--t4)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:8px 14px;border-radius:999px;font-weight:700;color:var(--on-tile);background:var(--c);animation:pop .3s ease-out}
.chip.wait{background:transparent;color:var(--muted);border:2px solid var(--line)}
.chip.done{background:var(--c)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.round-no{font-family:var(--display);color:var(--muted);font-size:22px}
.intro-title{font-size:clamp(52px,9vw,118px);line-height:.95;color:var(--c)}
.rules{font-size:clamp(18px,2.2vw,26px);max-width:40ch}
.qwrap{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}
.qcard{background:var(--panel);border-radius:26px;padding:clamp(20px,4vw,44px);display:flex;flex-direction:column;gap:18px;border-top:10px solid var(--c);min-width:0}
.qtext{font-size:clamp(24px,3.6vw,46px);font-weight:700;line-height:1.15;text-wrap:balance}
.emoji{font-size:clamp(80px,13vw,170px);line-height:1}
.smash{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.plus{font-family:var(--display);font-size:48px;color:var(--c)}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}
.pair .clue{background:var(--panel-2);border-radius:18px;padding:22px;font-size:clamp(20px,2.6vw,32px);font-weight:700}
.order-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.oi{border-radius:16px;padding:16px;font-weight:700;font-size:clamp(17px,2vw,22px);color:var(--on-tile)}
.oi:nth-child(4n+1){background:var(--t1)}.oi:nth-child(4n+2){background:var(--t2)}.oi:nth-child(4n+3){background:var(--t3)}.oi:nth-child(4n+4){background:var(--t4)}
.timer{width:150px;height:150px;position:relative;display:grid;place-items:center}
.timer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.timer b{font-family:var(--display);font-size:52px;font-weight:400;font-variant-numeric:tabular-nums}
.answered{font-size:18px;color:var(--muted)}
.reveal-ans{font-family:var(--display);font-size:clamp(40px,7vw,92px);line-height:1;color:var(--c);overflow-wrap:anywhere}
.reveal-sub{font-size:clamp(18px,2.2vw,26px);color:var(--muted)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.res{display:flex;justify-content:space-between;gap:10px;background:var(--panel);border-radius:14px;padding:12px 16px;min-width:0}
.res .who{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .what{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .pts{font-family:var(--display);font-size:22px;color:var(--good);font-variant-numeric:tabular-nums}
.res .pts.zero{color:var(--muted)}
.board{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:2.2em minmax(0,12em) 1fr 3.5em;gap:12px;align-items:center;font-size:20px}
.bar .pos{font-family:var(--display);color:var(--muted)}
.bar .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:28px;background:var(--panel);border-radius:8px;overflow:hidden}
.bar .fill{height:100%;background:var(--c);border-radius:8px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar .sc{font-family:var(--display);text-align:right;font-variant-numeric:tabular-nums}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;max-width:760px}
.pod{border-radius:18px 18px 0 0;padding:16px;text-align:center;color:var(--on-tile);display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-width:0}
.pod b{font-family:var(--display);font-weight:400;font-size:clamp(18px,2.6vw,30px);overflow-wrap:anywhere}
.pod span{font-weight:700}
.pod.p1{background:var(--t4);height:260px}.pod.p2{background:var(--t2);height:200px}.pod.p3{background:var(--t1);height:160px}

.vote-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.vopt{background:var(--panel);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px;border-top:8px solid var(--c);transition:opacity .4s,transform .4s;min-width:0}
.vopt b{font-family:var(--display);font-weight:400;font-size:clamp(20px,2.4vw,28px);color:var(--c)}
.vopt small{color:var(--muted);font-size:15px}
.vopt .vcount{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.vopt .track{height:14px;background:var(--studio);border-radius:7px;overflow:hidden}
.vopt .fill{height:100%;background:var(--c);transition:width .5s}
.vopt.win{background:var(--c);transform:scale(1.04)}.vopt.win b,.vopt.win .vcount{color:var(--on-tile)}
.vopt.lose{opacity:.45}
.pvote{display:grid;gap:12px}
.pvote button{text-align:left;background:var(--c);display:flex;flex-direction:column;gap:2px;padding:18px}
.pvote button b{font-family:var(--display);font-weight:400;font-size:22px}
.pvote button span{font-weight:500;font-size:14px}
.map{display:block;width:100%;height:100%;border-radius:16px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.host-map{width:100%;max-height:52vh;aspect-ratio:5/2;border-radius:16px;overflow:hidden;background:var(--sea)}
.pmap{width:100%;aspect-ratio:3/2;border-radius:16px;overflow:hidden;background:var(--sea);border:2px solid var(--line);cursor:crosshair}
.pmap-hint{font-size:14px;color:var(--muted)}
.wheel-wrap{display:grid;place-items:center}
.wheel{width:min(62vh,520px,100%);height:auto;filter:drop-shadow(0 10px 0 rgba(0,0,0,.35))}
.wheel-wrap.landed .wheel{animation:land .5s ease-out}
@keyframes land{50%{transform:scale(1.05)}}
.letter-tile{font-family:var(--display);font-size:clamp(90px,14vw,170px);line-height:1;width:1.3em;height:1.3em;display:grid;place-items:center;border-radius:28px;background:var(--t6);color:var(--on-tile);flex:none}
.letter-tile.small{font-size:72px}
.cat-list{margin:0;padding-left:1.4em;display:grid;gap:8px;font-size:clamp(20px,2.6vw,32px);font-weight:700}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.cat{background:var(--panel);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ans-list{display:flex;flex-direction:column;gap:6px}
.ans{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;column-gap:10px;text-align:left;padding:8px 12px;border-radius:12px;box-shadow:none;background:var(--panel-2);color:var(--text);border-left:6px solid var(--c);font-weight:500}
.ans .aw{font-weight:700;overflow-wrap:anywhere}
.ans small{grid-row:2;color:var(--muted);font-size:12px}
.ans em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-family:var(--display);font-size:20px;color:var(--good)}
.ans.shared em{color:var(--t4)}
.ans.bad,.ans.struck{opacity:.55}.ans.bad em,.ans.struck em{color:var(--muted)}
.ans.struck .aw{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--bad)}
.ans.bad:disabled{opacity:.45}
.plet{font-family:var(--display);font-size:64px;line-height:1;color:var(--on-tile);background:var(--t6);border-radius:18px;width:1.4em;height:1.4em;display:grid;place-items:center}
.seg{display:inline-flex;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:5px;align-self:flex-start;flex-wrap:wrap}
.seg button{background:transparent;color:var(--muted);box-shadow:none;padding:10px 18px;border-radius:11px}
.seg button.on{background:var(--t2);color:var(--on-tile)}
.teen-badge{background:var(--t6);color:var(--on-tile);font-weight:700;font-size:13px;padding:5px 10px;border-radius:999px}
/* phone */
.phone{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:18px max(18px,env(safe-area-inset-bottom,0px));max-width:520px;width:100%;margin:0 auto}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.me{padding:6px 12px;border-radius:999px;font-weight:700;color:var(--on-tile);background:var(--c)}
.pscore{font-family:var(--display);font-size:20px}
.pmain{flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center}
.big-msg{font-family:var(--display);font-size:clamp(30px,8vw,44px);line-height:1.05}
.ptimer{font-family:var(--display);font-size:22px;color:var(--t4);font-variant-numeric:tabular-nums}
.pclue{background:var(--panel);border-radius:18px;padding:16px;font-weight:500}
.pick{display:grid;gap:10px}
.pick button{text-align:left;display:flex;gap:12px;align-items:center;background:var(--panel-2);color:var(--text);box-shadow:none;border:2px solid var(--line)}
.pick button .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);background:var(--studio);color:var(--muted);flex:none}
.pick button.sel{background:var(--t2);color:var(--on-tile);border-color:var(--t2)}
.pick button.sel .n{background:var(--on-tile);color:var(--t2)}
.delta{font-family:var(--display);font-size:72px;line-height:1}
.delta.good{color:var(--good)}.delta.none{color:var(--muted)}
.full{width:100%;font-size:20px;padding:18px}
@media (max-width:720px){
  .qwrap{grid-template-columns:1fr}.timer{width:110px;height:110px}.timer b{font-size:38px}
  .pair{grid-template-columns:1fr}.pair .plus{text-align:center}
  .bar{grid-template-columns:2em minmax(0,7em) 1fr 3em;font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

      { emoji:"🐊", clue:"Danish toy bricks that click together", answer:"Crocodilego", parts:"Crocodile + Lego" },

      { emoji:"🧲", clue:"Streaming service behind Stranger Things", answer:"Magnetflix", parts:"Magnet + Netflix" },

/* ============================================================
   CONNECTION LAYER — the only part tied to Claude hosting.
   To move to your own server, replace createNet() with a
   Socket.IO/Firebase version exposing the same 3 methods:
     set(obj)        publish my state (host: game state, player: name+answer)
     onPeers(fn)     fn([{id, me, data}]) whenever anyone's state changes
     onStatus(fn)    fn(connectedBoolean)
   ============================================================ */
function createNet(code){
  let me = "";
  try { me = sessionStorage.getItem("hpq-peer") || ""; } catch(e){}
  if(!me){ me = Math.random().toString(36).slice(2) + Date.now().toString(36); try { sessionStorage.setItem("hpq-peer", me); } catch(e){} }
  const fns = [], sfns = []; let ws = null, open = false, mine = {}, peers = [];
  function connect(){
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    ws.onopen = () => { open = true; ws.send(JSON.stringify({ t:"join", room:code, id:me, data:mine })); sfns.forEach(f => f(true)); };
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch(err){ return; }
      if(m.t === "peers"){ peers = m.peers.map(p => ({ id:p.id, me:p.id === me, data:p.data || {} })); fns.forEach(f => f(peers)); } };
    ws.onclose = () => { open = false; sfns.forEach(f => f(false)); setTimeout(connect, 1500); };
    ws.onerror = () => { try { ws.close(); } catch(e){} };
  }
  connect();
  return {
    set(obj){ for(const k in obj){ if(obj[k] === null) delete mine[k]; else mine[k] = obj[k]; }
      if(open) ws.send(JSON.stringify({ t:"set", data:obj })); return Promise.resolve(); },
    onPeers(fn){ fns.push(fn); fn(peers); },
    onStatus(fn){ sfns.push(fn); fn(open); }
  };
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, "");
function lev(a, b){
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_, j) => j);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const close = (guess, answer) => { const g = norm(guess), a = norm(answer); if(!g) return false; const tol = a.length <= 4 ? 0 : a.length <= 8 ? 1 : 2; return lev(g, a) <= tol; };
const PCOL = ["--t1","--t2","--t3","--t4"];

  const pts = Array.from({length:10}, (_, i) => { const a = Math.PI / 5 * i - Math.PI / 2, rr = i % 2 ? R2 : R1; return `${(x + rr * Math.cos(a)).toFixed(2)},${(y + rr * Math.sin(a)).toFixed(2)}`; }).join(" ");

const poolFor = r => H.mode === "teen" && r.teenPool ? r.teenPool : r.pool;
const H = { net:null, connected:false, gid:"", code:"", ph:"lobby", ri:0, qi:0, endsAt:0, dur:1, scores:{}, answers:{}, players:[], shown:[], reveal:null,
            mode:(store.get("hpq-mode") === "teen" ? "teen" : "adult"), played:[], qs:[], cats:[], strikes:{}, spinStart:0, spinTo:0, opts:[], votes:{}, tally:{}, tie:false };
const vKey = () => `${H.gid}.v${H.played.length}`;
const curR = () => ROUNDS[H.ri];
const curQ = () => H.qs[H.qi];
const qKey = () => `${H.gid}.${H.ri}.${H.qi}`;

async function startHost(){
  const L = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  H.code = Array.from({length:4}, () => L[Math.floor(Math.random()*L.length)]).join("");
  H.gid = Math.random().toString(36).slice(2, 7);
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch(e){}
  renderHost();
  H.net = await createNet(H.code);
  if(H.net){
    H.net.onStatus(c => { H.connected = c; renderHost(); });
    H.net.onPeers(hostPeers);
    push();
  }
  renderHost();
  setInterval(hostTick, 250);
  document.addEventListener("keydown", e => { if(e.code === "Space" && e.target === document.body){ e.preventDefault(); next(); } });
}

function hostPeers(list){
  const seen = new Set();
  H.players = [];
  for(const p of list){
    const d = p.data;
    if(d.role !== "p" || !d.name) continue;
    const name = String(d.name).slice(0, 16);
    if(!seen.has(name)){ seen.add(name); H.players.push(name); }
    if(!(name in H.scores)) H.scores[name] = 0;
    if(H.ph === "q" && d.a && d.a.k === qKey()){
      if(curR().type === "letters"){ const prev = H.answers[name]; if(!prev || !prev.done) H.answers[name] = { v:d.a.v, t:prev ? prev.t : Date.now(), done:!!d.a.done }; }
      else if(!H.answers[name]) H.answers[name] = { v:d.a.v, t:Date.now(), done:true };
    }
    if(H.ph === "vote" && d.a && d.a.k === vKey() && !(name in H.votes) && H.opts.includes(d.a.v)) H.votes[name] = d.a.v;
  }
  if(H.ph === "q" && H.players.length && H.players.every(n => H.answers[n] && H.answers[n].done)) doReveal();
  else if(H.ph === "vote" && H.players.length && H.players.every(n => n in H.votes)) resolveVote();
  else renderHost();
}

function shuffled(items){
  let s;
  do { s = items.slice().sort(() => Math.random() - .5); } while(items.length > 1 && s.every((x, i) => x === items[i]));
  return s;
}

function next(){
  if(H.ph === "lobby" || H.ph === "final"){ if(H.ph === "final"){ Object.keys(H.scores).forEach(k => H.scores[k] = 0); H.gid = Math.random().toString(36).slice(2,7); } H.played = []; startVote(); return; }
  else if(H.ph === "vote"){ resolveVote(); return; }
  else if(H.ph === "voted") H.ph = "intro";
  else if(H.ph === "intro") startQ();
  else if(H.ph === "spin"){ beginLetters(); return; }
  else if(H.ph === "q") doReveal();
  else if(H.ph === "reveal"){ if(H.qi < H.qs.length - 1){ H.qi++; startQ(); return; } H.ph = "board"; }
  else if(H.ph === "board"){ if(H.played.length < ROUNDS.length){ startVote(); return; } H.ph = "final"; }
  push(); renderHost();
}

function startVote(){
  H.opts = ROUNDS.map((_, i) => i).filter(i => !H.played.includes(i));
  H.votes = {}; H.tally = {}; H.tie = false;
  if(H.opts.length === 1){ pickRound(H.opts[0]); H.ph = "intro"; push(); renderHost(); return; }
  H.ph = "vote"; H.dur = VOTE_SECS * 1000; H.endsAt = Date.now() + H.dur;
  push(); renderHost();
}
function pickRound(i){ H.ri = i; H.qi = 0; H.played.push(i); H.qs = drawQuestions(ROUNDS[i]); }
/* Random draw each game. Questions already seen on this screen are held back until the pool runs low. */
function drawQuestions(r){
  const k = "hpq-used-" + r.id + (H.mode === "teen" && r.teenPool ? "-teen" : "");
  const pool = poolFor(r);
  let used = []; try { used = JSON.parse(store.get(k) || "[]"); } catch(e){}
  let fresh = pool.map((_, i) => i).filter(i => !used.includes(i));
  if(fresh.length < r.perGame){ used = []; fresh = pool.map((_, i) => i); }
  const pick = fresh.sort(() => Math.random() - .5).slice(0, r.perGame);
  store.set(k, JSON.stringify(used.concat(pick)));
  return pick.map(i => pool[i]);
}
function resolveVote(){
  if(H.ph !== "vote") return;
  const t = {}; H.opts.forEach(i => t[i] = 0);
  Object.values(H.votes).forEach(v => t[v]++);
  const top = Math.max(...Object.values(t));
  const leaders = H.opts.filter(i => t[i] === top);
  H.tally = t; H.tie = leaders.length > 1;
  pickRound(leaders[Math.floor(Math.random() * leaders.length)]);
  H.ph = "voted"; push(); renderHost();
}

const SPIN_MS = 4500;
function startQ(){
  H.ph = "q"; H.answers = {}; H.reveal = null; H.strikes = {};
  H.shown = curR().type === "order" ? shuffled(curQ().items) : [];
  if(curR().type === "letters"){
    const r = curR();
    const teen = H.mode === "teen";
    H.cats = (teen ? r.teenFixed : r.fixed).concat((teen ? r.teenExtras : r.extras).slice().sort(() => Math.random() - .5).slice(0, 2));
    H.spinTo = 360 * 6 - WHEEL.indexOf(curQ().letter) * (360 / WHEEL.length);
    H.spinStart = Date.now(); H.ph = "spin";
    push(); renderHost(); requestAnimationFrame(spinLoop); return;
  }
  H.dur = curR().secs * 1000; H.endsAt = Date.now() + H.dur;
  push(); renderHost();
}

function spinLoop(){
  if(H.ph !== "spin") return;
  const t = Math.min(1, (Date.now() - H.spinStart) / SPIN_MS);
  const g = $("#wheel-g"); if(g) g.setAttribute("transform", `rotate(${(H.spinTo * (1 - Math.pow(1 - t, 3))).toFixed(2)} 200 200)`);
  if(t < 1) requestAnimationFrame(spinLoop);
  else { const w = $("#wheel-wrap"); if(w) w.classList.add("landed"); setTimeout(beginLetters, 1200); }
}
function beginLetters(){
  if(H.ph !== "spin") return;
  H.ph = "q"; H.dur = curR().secs * 1000; H.endsAt = Date.now() + H.dur;
  push(); renderHost();
}
function wheelSvg(){
  const n = WHEEL.length, seg = 360 / n, R0 = 190, cols = ["--t1","--t2","--t3","--t4","--t5"];
  const pt = (a, r) => [200 + r * Math.sin(a * Math.PI / 180), 200 - r * Math.cos(a * Math.PI / 180)];
  const slices = WHEEL.map((L, i) => {
    const a0 = i * seg - seg / 2, a1 = a0 + seg, [x0, y0] = pt(a0, R0), [x1, y1] = pt(a1, R0), [tx, ty] = pt(i * seg, 150);
    return `<path d="M200 200 L${x0.toFixed(1)} ${y0.toFixed(1)} A${R0} ${R0} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="var(${cols[i % 5]})" stroke="var(--studio)" stroke-width="2"/>
      <text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" transform="rotate(${i * seg} ${tx.toFixed(1)} ${ty.toFixed(1)})" text-anchor="middle" dominant-baseline="central" font-family="var(--display)" font-size="30" fill="var(--on-tile)">${L}</text>`;
  }).join("");
  return `<svg viewBox="0 0 400 420" class="wheel" role="img" aria-label="Letter wheel"><g transform="translate(0 20)"><g id="wheel-g">${slices}<circle cx="200" cy="200" r="34" fill="var(--studio)" stroke="var(--text)" stroke-width="4"/></g></g>
    <polygon points="200,52 184,8 216,8" fill="var(--text)" stroke="var(--studio)" stroke-width="3"/></svg>`;
}
const cleanWord = v => norm(String(v || "").replace(/^\s*(the|a|an)\s+/i, ""));
function lettersDetail(){
  const q = curQ(), A = H.answers, L = q.letter.toLowerCase();
  return H.cats.map((cat, ci) => {
    const rows = Object.keys(A).map(n => {
      const raw = Array.isArray(A[n].v) ? String(A[n].v[ci] || "").trim() : "";
      const k = cleanWord(raw);
      return { n, raw, k, ok:k.length >= 2 && k[0] === L, struck:!!H.strikes[n + "|" + ci] };
    }).filter(x => x.raw);
    const counts = {}; rows.forEach(x => { if(x.ok && !x.struck) counts[x.k] = (counts[x.k] || 0) + 1; });
    rows.forEach(x => x.pts = x.ok && !x.struck ? (counts[x.k] === 1 ? 2 : 1) : 0);
    return { cat, rows };
  });
}
function toggleStrike(k){
  if(H.ph !== "reveal") return;
  H.strikes[k] = !H.strikes[k];
  const old = H.reveal.res, nw = score();
  new Set(Object.keys(old).concat(Object.keys(nw))).forEach(n => H.scores[n] = (H.scores[n] || 0) - (old[n] || 0) + (nw[n] || 0));
  H.reveal.res = nw; push(); renderHost();
}

function score(){
  const r = curR(), q = curQ(), A = H.answers, res = {};
  const names = Object.keys(A);
  const speedRank = ok => names.filter(ok).sort((a, b) => A[a].t - A[b].t).forEach((n, i) => res[n] = 2 + (i === 0 ? 1 : 0));
  if(r.type === "text") speedRank(n => close(A[n].v, q.answer));
  if(r.type === "pair") speedRank(n => { const v = Array.isArray(A[n].v) ? A[n].v : []; const [x, y] = q.answer;
    if(norm(v[0]) === norm(v[1])) return false;
    return (close(v[0], x) && close(v[1], y)) || (close(v[0], y) && close(v[1], x)); });
  if(r.type === "order") names.forEach(n => { const v = Array.isArray(A[n].v) ? A[n].v : []; const c = q.items.filter((it, i) => v[i] === it).length; if(c) res[n] = c; });
  if(r.type === "letters") lettersDetail().forEach(c => c.rows.forEach(x => { if(x.pts) res[x.n] = (res[x.n] || 0) + x.pts; }));
  if(r.type === "map"){
    const d = names.map(n => { const v = A[n].v; return [n, Array.isArray(v) && isFinite(v[0]) && isFinite(v[1]) ? km(v, [q.lat, q.lon]) : NaN]; }).filter(x => isFinite(x[1])).sort((a, b) => a[1] - b[1]);
    d.forEach(([n, dist], i) => { const pts = ([3,2,1][i] || 0) + (dist <= 250 ? 2 : 0); if(pts) res[n] = pts; });
  }
  if(r.type === "number"){
    const d = names.map(n => [n, Math.abs(parseFloat(String(A[n].v).replace(/,/g, "")) - q.answer)]).filter(x => isFinite(x[1])).sort((a, b) => a[1] - b[1]);
    let rank = 0, prev = null;
    d.forEach(([n, diff], i) => { if(diff !== prev){ rank = i; prev = diff; } const pts = ([3,2,1][rank] || 0) + (diff === 0 ? 2 : 0); if(pts) res[n] = pts; });
  }
  return res;
}

function answerText(){
  const r = curR(), q = curQ();
  if(r.type === "text") return { main:q.answer, sub:q.parts };
  if(r.type === "pair") return { main:q.answer.map(w => w[0].toUpperCase() + w.slice(1)).join(" "), sub:`${q.c1} / ${q.c2}` };
  if(r.type === "order") return { main:q.items.join(" → "), sub:q.detail || "" };
  if(r.type === "map") return { main:q.place, sub:q.name };
  if(r.type === "letters") return { main:"Letter " + q.letter, sub:"" };
  return { main:fmtNum(q.answer, q.plain) + (q.unit ? " " + q.unit : ""), sub:"" };
}

function doReveal(){
  if(H.ph !== "q") return;
  const res = score();
  Object.entries(res).forEach(([n, p]) => H.scores[n] = (H.scores[n] || 0) + p);
  H.reveal = { res, ...answerText() };
  H.ph = "reveal";
  push(); renderHost();
}

function sortedScores(){ return Object.entries(H.scores).sort((a, b) => b[1] - a[1]); }

function publicState(){
  const r = curR(), q = curQ();
  const s = { gid:H.gid, ph:H.ph, ri:H.ri, qi:H.qi, nr:ROUNDS.length, nq:H.qs.length, rt:r.type, title:r.title, col:r.color,
              k:qKey(), endsAt:H.endsAt, now:Date.now(), rn:H.played.length };
  if(H.ph === "vote"){ s.k = vKey(); s.opts = H.opts.map(i => ({ i, t:ROUNDS[i].title, b:ROUNDS[i].blurb, c:ROUNDS[i].color })); }
  if(H.ph === "voted"){ s.tie = H.tie; s.noVotes = !Object.keys(H.votes).length; }
  if(H.ph === "intro"){ s.rules = r.rules; s.scoring = r.scoring; }
  if(H.ph === "q" || H.ph === "reveal"){
    if(r.type === "text") s.q = { clue:q.clue };
    if(r.type === "pair") s.q = { c1:q.c1, c2:q.c2 };
    if(r.type === "order") s.q = { prompt:q.prompt, items:H.shown };
    if(r.type === "number") s.q = { prompt:q.prompt, unit:q.unit || "" };
    if(r.type === "map") s.q = { name:q.name, emoji:q.emoji, the:q.the };
    if(r.type === "letters") s.q = { letter:q.letter, cats:H.cats };
  }
  if(H.ph === "reveal"){ s.rv = { main:H.reveal.main, res:H.reveal.res };
    if(r.type === "map"){ s.rv.km = {}; Object.entries(H.answers).forEach(([n, a]) => { if(Array.isArray(a.v)) s.rv.km[n] = Math.round(km(a.v, [q.lat, q.lon])); }); } }
  s.sc = sortedScores().slice(0, 20);
  while(JSON.stringify(s).length > 3600 && s.sc.length > 3) s.sc.pop();
  return s;
}
function push(){ if(H.net) H.net.set({ role:"h", s:publicState() }); }

function hostTick(){
  if(H.ph === "spin" && Date.now() - H.spinStart > SPIN_MS + 3000) beginLetters();
  if(H.ph !== "q" && H.ph !== "vote") return;
  const left = Math.max(0, H.endsAt - Date.now());
  const el = $("#tleft"), ring = $("#tring");
  if(el) el.textContent = Math.ceil(left / 1000);
  if(ring){ const f = left / H.dur; ring.style.strokeDashoffset = String(440 * (1 - f)); }
  if(left <= 0){ if(H.ph === "q") doReveal(); else resolveVote(); }
}

function renderHost(){
  const r = curR(), q = curQ(), c = `var(${r.color})`;
  let body = "", ctrl = "Next";
  const status = H.net ? (H.connected ? "" : `<div class="banner">Connecting to the room…</div>`)
    : `<div class="banner">Can’t reach the game server. Check your connection and refresh.</div>`;

  if(H.ph === "lobby"){
    body = `
      <div class="stack" style="gap:8px"><div class="label">Room code</div><div class="code-big">${H.code.split("").map(ch => `<div>${ch}</div>`).join("")}</div></div>
      <p class="rules">On your phone, open this same page, tap <b>Join on phone</b> and enter the code.</p>
      <div class="stack" style="gap:8px"><div class="label">Questions for</div>
        <div class="seg" role="radiogroup" aria-label="Question set">
          <button type="button" role="radio" id="m-adult" aria-checked="${H.mode === "adult"}" class="${H.mode === "adult" ? "on" : ""}">Grown-ups</button>
          <button type="button" role="radio" id="m-teen" aria-checked="${H.mode === "teen"}" class="${H.mode === "teen" ? "on" : ""}">Young teens</button>
        </div></div>
      <div class="stack" style="gap:10px"><div class="label">${H.players.length} player${H.players.length === 1 ? "" : "s"} in</div>
        <div class="chips">${H.players.map(n => `<span class="chip" style="--c:${colorFor(n)}">${esc(n)}</span>`).join("") || `<span class="chip wait">Waiting for players…</span>`}</div></div>`;
    ctrl = "Start game";
  }
  const timerHtml = col => `<div class="timer"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="70" fill="none" stroke="var(--panel)" stroke-width="10"/><circle id="tring" cx="75" cy="75" r="70" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="0"/></svg><b id="tleft">${Math.ceil(Math.max(0, H.endsAt - Date.now()) / 1000)}</b></div>`;
  if(H.ph === "vote"){
    const t = {}; H.opts.forEach(i => t[i] = 0); Object.values(H.votes).forEach(v => t[v]++);
    const n = Object.keys(H.votes).length;
    body = `<div class="round-no">Round ${H.played.length + 1} of ${ROUNDS.length}</div>
      <div class="qwrap"><div class="stack"><h1 style="font-size:clamp(40px,6vw,76px);line-height:1">Vote for the next round</h1><p class="rules" style="margin:0">Pick on your phone. Most votes wins. A tie gets settled at random.</p></div>
        <div class="stack" style="align-items:center">${timerHtml("var(--t4)")}<div class="answered">${n} / ${H.players.length} voted</div></div></div>
      <div class="vote-opts">${H.opts.map(i => `<div class="vopt" style="--c:var(${ROUNDS[i].color})"><b>${esc(ROUNDS[i].title)}</b><small>${esc(ROUNDS[i].blurb)}</small><div class="vcount">${t[i]} vote${t[i] === 1 ? "" : "s"}</div><div class="track"><div class="fill" style="width:${n ? (t[i] / n * 100).toFixed(0) : 0}%"></div></div></div>`).join("")}</div>
      <div class="chips">${H.players.map(p => `<span class="chip ${p in H.votes ? "done" : "wait"}" style="--c:${colorFor(p)}">${esc(p)}</span>`).join("")}</div>`;
    ctrl = "Close voting";
  }
  if(H.ph === "voted"){
    const none = Object.values(H.tally).every(v => !v);
    body = `<div class="label">${none ? "No votes, so the screen picked" : H.tie ? "It’s a tie! Picked at random" : "The players have chosen"}</div>
      <h1 class="intro-title" style="--c:${c}">${esc(r.title)}</h1>
      <div class="vote-opts">${H.opts.map(i => `<div class="vopt ${i === H.ri ? "win" : "lose"}" style="--c:var(${ROUNDS[i].color})"><b>${esc(ROUNDS[i].title)}</b><div class="vcount">${H.tally[i] || 0} vote${H.tally[i] === 1 ? "" : "s"}</div></div>`).join("")}</div>`;
    ctrl = "Let’s go";
  }
  if(H.ph === "intro"){
    body = `<div class="round-no">Round ${H.played.length} of ${ROUNDS.length}</div>
      <h1 class="intro-title" style="--c:${c}">${esc(r.title)}</h1>
      <p class="rules">${esc(r.rules)}</p><p class="reveal-sub" style="margin:0">${esc(r.scoring)}</p>`;
    ctrl = "First question";
  }
  if(H.ph === "spin"){
    body = `<div class="row" style="justify-content:space-between"><div class="round-no" style="color:${c}">${esc(r.title)}</div><div class="round-no">Spin ${H.qi + 1} / ${H.qs.length}</div></div>
      <div class="wheel-wrap" id="wheel-wrap">${wheelSvg()}</div>`;
    ctrl = "Skip spin";
  }
  if(H.ph === "q" || H.ph === "reveal"){
    let qhtml = "";
    if(r.type === "text") qhtml = `<div class="smash"><div class="emoji" aria-label="picture clue">${q.emoji}</div><div class="plus">+</div><div class="qtext" style="flex:1;min-width:200px">${esc(q.clue)}</div></div>`;
    if(r.type === "pair") qhtml = `<div class="pair"><div class="clue">${esc(q.c1)}</div><div class="plus">+</div><div class="clue">${esc(q.c2)}</div></div>`;
    if(r.type === "order") qhtml = `<div class="qtext">${esc(q.prompt)}</div><div class="order-items">${(H.ph === "reveal" ? q.items : H.shown).map((it, i) => `<div class="oi">${H.ph === "reveal" ? (i + 1) + ". " : ""}${esc(it)}</div>`).join("")}</div>`;
    if(r.type === "number") qhtml = `<div class="qtext">${esc(q.prompt)}</div>${q.unit ? `<div class="reveal-sub">Answer in ${esc(q.unit)}</div>` : ""}`;
    if(r.type === "letters") qhtml = `<div class="row" style="gap:28px;align-items:center"><div class="letter-tile">${esc(q.letter)}</div><ol class="cat-list">${H.cats.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>`;
    if(r.type === "map") qhtml = `<div class="smash"><div class="emoji" style="font-size:clamp(60px,9vw,110px)">${q.emoji}</div><div class="qtext" style="flex:1;min-width:200px">${esc(whereIs(q.name, q.the))}</div></div>
      ${H.ph === "q" ? `<div class="host-map">${mapSvg(FULL)}</div>` : ""}`;
    const head = `<div class="row" style="justify-content:space-between"><div class="round-no" style="color:${c}">${esc(r.title)}</div><div class="round-no">Q${H.qi + 1} / ${H.qs.length}</div></div>`;
    if(H.ph === "q"){
      const done = Object.values(H.answers).filter(a => a.done).length;
      body = `${head}<div class="qwrap"><div class="qcard" style="--c:${c}">${qhtml}</div>
        <div class="stack" style="align-items:center">${timerHtml(c)}
        <div class="answered">${done} / ${H.players.length} in</div></div></div>
        <div class="chips">${H.players.map(n => `<span class="chip ${H.answers[n] && H.answers[n].done ? "done" : "wait"}" style="--c:${colorFor(n)}">${esc(n)}</span>`).join("")}</div>`;
      ctrl = "Reveal now";
    } else {
      const rows = H.players.concat(Object.keys(H.answers).filter(n => !H.players.includes(n))).map(n => {
        const a = H.answers[n]; const p = H.reveal.res[n] || 0;
        const said = !a ? "No answer" : r.type === "map" ? (Array.isArray(a.v) ? Math.round(km(a.v, [q.lat, q.lon])).toLocaleString("en-GB") + " km away" : "No pin") : Array.isArray(a.v) ? a.v.join(r.type === "order" ? ", " : " ") : a.v;
        return `<div class="res"><div style="min-width:0"><div class="who">${esc(n)}</div><div class="what">${esc(said)}</div></div><div class="pts ${p ? "" : "zero"}">+${p}</div></div>`;
      }).join("");
      const mapReveal = r.type === "map" ? `<div class="host-map">${mapSvg(FULL, Object.entries(H.answers).filter(([, a]) => Array.isArray(a.v)).map(([n, a]) => `<line x1="${toXY(a.v[0], a.v[1])[0]}" y1="${toXY(a.v[0], a.v[1])[1]}" x2="${toXY(q.lat, q.lon)[0]}" y2="${toXY(q.lat, q.lon)[1]}" stroke="${colorFor(n)}" stroke-width=".5" stroke-dasharray="1.5 1.5"/>`).join("") + Object.entries(H.answers).filter(([, a]) => Array.isArray(a.v)).map(([n, a]) => pin(a.v[0], a.v[1], colorFor(n), 360, n)).join("") + star(q.lat, q.lon, 360))}</div>` : "";
      body = `${head}${mapReveal}<div class="stack" style="gap:8px"><div class="label">The answer</div><div class="reveal-ans" style="--c:${c}">${esc(H.reveal.main)}</div>${H.reveal.sub ? `<div class="reveal-sub">${esc(H.reveal.sub)}</div>` : ""}</div>
        <div class="results">${rows}</div>`;
      if(r.type === "letters"){
        const det = lettersDetail();
        const tot = H.players.concat(Object.keys(H.answers).filter(n => !H.players.includes(n))).map(n => { const p = H.reveal.res[n] || 0;
          return `<div class="res"><div class="who">${esc(n)}</div><div class="pts ${p ? "" : "zero"}">+${p}</div></div>`; }).join("");
        body = `${head}<div class="row" style="gap:20px;align-items:center"><div class="letter-tile small">${esc(q.letter)}</div><p class="reveal-sub" style="margin:0;flex:1;min-width:220px">Unique answers score 2, shared answers 1. Tap an answer to strike it out if the room says no. Tap again to put it back.</p></div>
          <div class="cat-grid">${det.map((cg, ci) => `<div class="cat"><div class="label">${esc(cg.cat)}</div><div class="ans-list">${cg.rows.map(x => `<button type="button" class="ans ${x.struck ? "struck" : !x.ok ? "bad" : x.pts === 2 ? "uniq" : "shared"}" data-k="${esc(x.n + "|" + ci)}" style="--c:${colorFor(x.n)}" ${x.ok || x.struck ? "" : "disabled"}><span class="aw">${esc(x.raw)}</span><small>${esc(x.n)}</small><em>${x.pts ? "+" + x.pts : "0"}</em></button>`).join("") || `<span class="reveal-sub" style="font-size:15px">No answers</span>`}</div></div>`).join("")}</div>
          <div class="results">${tot}</div>`;
      }
      ctrl = H.qi < H.qs.length - 1 ? (r.type === "letters" ? "Spin again" : "Next question") : "Scores";
    }
  }
  if(H.ph === "board"){
    const sc = sortedScores(), top = Math.max(1, ...sc.map(s => s[1]));
    body = `<div class="round-no">After round ${H.played.length} of ${ROUNDS.length}</div><h2 style="font-size:clamp(36px,5vw,60px)">Scores</h2>
      <div class="board">${sc.map(([n, p], i) => `<div class="bar" style="--c:${colorFor(n)}"><span class="pos">${i + 1}</span><span class="nm">${esc(n)}</span><div class="track"><div class="fill" style="width:${(p / top * 100).toFixed(1)}%"></div></div><span class="sc">${p}</span></div>`).join("") || `<p class="reveal-sub">No players yet.</p>`}</div>`;
    ctrl = H.played.length < ROUNDS.length - 1 ? "Vote for the next round" : H.played.length < ROUNDS.length ? "Final round" : "Final results";
  }
  if(H.ph === "final"){
    const sc = sortedScores(); const [a, b, d] = sc;
    const pod = (e, cls) => e ? `<div class="pod ${cls}"><b>${esc(e[0])}</b><span>${e[1]} pts</span></div>` : `<div></div>`;
    body = `<h1 class="intro-title" style="--c:var(--t4)">${a ? esc(a[0]) + " wins!" : "Game over"}</h1>
      <div class="podium">${pod(b, "p2")}${pod(a, "p1")}${pod(d, "p3")}</div>
      ${sc.length > 3 ? `<div class="reveal-sub">${sc.slice(3).map(([n, p], i) => `${i + 4}. ${esc(n)} ${p}`).join(" · ")}</div>` : ""}`;
    ctrl = "Play again";
  }

  app.innerHTML = `
    <div class="hbar"><div class="logo" style="font-size:28px"><span>House</span> <span>Party</span> <span>Quiz</span></div>
      <div class="row">${H.mode === "teen" ? `<span class="teen-badge">Young teens</span>` : ""}<span class="label">Code</span><span class="code-chip">${H.code}</span></div></div>
    ${status}
    <div class="stage">${body}</div>
    <div class="controls"><span class="label">Space bar = next</span>
      <div class="row">${H.ph !== "lobby" && H.ph !== "final" ? `<button class="ghost" id="h-end">End game</button>` : ""}<button id="h-next" ${H.ph === "lobby" && !H.players.length && H.net ? "disabled" : ""}>${esc(ctrl)}</button></div></div>`;
  $("#h-next").onclick = next;
  const setMode = m => { H.mode = m; store.set("hpq-mode", m); renderHost(); };
  if($("#m-adult")){ $("#m-adult").onclick = () => setMode("adult"); $("#m-teen").onclick = () => setMode("teen"); }
  document.querySelectorAll(".ans[data-k]").forEach(b => b.onclick = () => toggleStrike(b.dataset.k));
  if(H.ph === "spin") requestAnimationFrame(spinLoop);
  const end = $("#h-end"); if(end) end.onclick = () => { H.ph = "final"; push(); renderHost(); };
}

/* ============================================================ PLAYER */
const P = { net:null, name:"", code:"", s:null, sJSON:"", localEnd:0, sent:null, pick:[], view:"", connected:false };

function renderJoin(err){
  app.innerHTML = `<div class="phone"><div class="logo" style="font-size:36px"><span>House</span> <span>Party</span> <span>Quiz</span></div>
    <form class="pmain" id="jf" style="justify-content:flex-start">
      <label class="stack" style="gap:6px"><span class="label">Room code</span><input id="j-code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" style="font-family:var(--mono);letter-spacing:.3em;text-transform:uppercase"></label>
      <label class="stack" style="gap:6px"><span class="label">Your name</span><input id="j-name" maxlength="14" autocomplete="nickname" placeholder="e.g. Chris"></label>
      ${err ? `<div class="banner" style="color:var(--bad)">${esc(err)}</div>` : ""}
      <button class="full" type="submit">Join</button>
      <button class="ghost" type="button" id="j-back">Back</button>
    </form></div>`;
  $("#j-name").value = store.get("hpq-name") || "";
  $("#jf").onsubmit = e => { e.preventDefault(); joinGame(); };
  $("#j-back").onclick = renderStart;
  $("#j-code").focus();
}

async function joinGame(){
  const code = $("#j-code").value.trim().toUpperCase().replace(/[^A-Z]/g, "");
  const name = $("#j-name").value.trim().replace(/\s+/g, " ").slice(0, 14);
  if(code.length !== 4) return renderJoin("The room code is 4 letters, shown on the big screen.");
  if(!name) return renderJoin("Add a name so the host knows who you are.");
  store.set("hpq-name", name);
  P.code = code; P.name = name;
  app.innerHTML = `<div class="phone"><div class="pmain"><div class="big-msg">Joining ${esc(code)}…</div></div></div>`;
  P.net = await createNet(code);
  if(!P.net) return renderJoin("Can’t reach the game server. Check your connection and try again.");
  P.net.onStatus(c => { P.connected = c; });
  P.net.set({ role:"p", name:P.name, a:null });
  P.net.onPeers(playerPeers);
  setInterval(playerTick, 250);
  renderPlayer(true);
}

function playerPeers(list){
  const host = list.find(p => p.data.role === "h" && p.data.s);
  const s = host ? host.data.s : null;
  const j = JSON.stringify(s);
  if(j === P.sJSON) return;
  P.sJSON = j; P.s = s;
  if(s && (s.ph === "q" || s.ph === "vote")) P.localEnd = Date.now() + (s.endsAt - s.now);
  renderPlayer();
}

function playerTick(){
  const el = $("#ptl"); if(!el) return;
  el.textContent = Math.max(0, Math.ceil((P.localEnd - Date.now()) / 1000)) + "s";
}

function submit(v){
  if(!P.s || (P.s.ph !== "q" && P.s.ph !== "vote")) return;
  P.sent = P.s.k;
  P.net.set({ role:"p", name:P.name, a:{ k:P.s.k, v, done:true } });
  renderPlayer(true);
}

function myScore(){ const s = P.s; if(!s) return 0; const e = (s.sc || []).find(x => x[0] === P.name); return e ? e[1] : 0; }

function renderPlayer(force){
  const s = P.s;
  const view = !s ? "wait" : `${s.ph}|${s.k}|${P.sent === s.k}|${s.rv && s.rv.res ? (s.rv.res[P.name] || 0) : ""}`;
  if(!force && view === P.view){ const ps = $("#pscore"); if(ps) ps.textContent = myScore() + " pts"; return; }
  P.view = view;
  let main = "";
  if(!s) main = `<div class="big-msg">You’re in!</div><p class="reveal-sub" style="margin:0">Waiting for the host to start. Watch the big screen.</p>`;
  else if(s.ph === "lobby") main = `<div class="big-msg">You’re in!</div><p class="reveal-sub" style="margin:0">Look for your name on the big screen.</p>`;
  else if(s.ph === "vote" && P.sent === s.k) main = `<div class="big-msg">Vote cast</div><p class="reveal-sub" style="margin:0">Watch the big screen for the result.</p>`;
  else if(s.ph === "vote") main = `<div class="row" style="justify-content:space-between"><span class="label">Round ${s.rn + 1} of ${s.nr}</span><span class="ptimer" id="ptl"></span></div>
      <div class="big-msg">Pick the next round</div>
      <div class="pvote">${(s.opts || []).map(o => `<button type="button" data-v="${o.i}" style="--c:var(${o.c})"><b>${esc(o.t)}</b><span>${esc(o.b)}</span></button>`).join("")}</div>`;
  else if(s.ph === "voted") main = `<div class="label">${s.noVotes ? "Picked at random" : s.tie ? "Tie! Picked at random" : "Next round"}</div><div class="big-msg" style="color:var(${s.col})">${esc(s.title)}</div>`;
  else if(s.ph === "intro") main = `<div class="label">Round ${s.rn} of ${s.nr}</div><div class="big-msg" style="color:var(${s.col})">${esc(s.title)}</div><p style="margin:0">${esc(s.rules)}</p>`;
  else if(s.ph === "spin") main = `<div class="label" style="color:var(${s.col})">${esc(s.title)}</div><div class="big-msg">The wheel is spinning…</div><p class="reveal-sub" style="margin:0">Watch the big screen. Your list appears here when it stops.</p>`;
  else if(s.ph === "q" && P.sent === s.k) main = `<div class="big-msg">Locked in</div><p class="reveal-sub" style="margin:0">Eyes on the big screen.</p>`;
  else if(s.ph === "q"){
    const q = s.q || {};
    const top = `<div class="row" style="justify-content:space-between"><span class="label" style="color:var(${s.col})">${esc(s.title)} · Q${s.qi + 1}</span><span class="ptimer" id="ptl"></span></div>`;
    if(s.rt === "text") main = `${top}<div class="pclue">Picture on the big screen + ${esc(q.clue)}</div>
      <form id="pf" class="stack"><input id="pa" autocomplete="off" autocapitalize="words" placeholder="Your smashed answer"><button class="full" type="submit">Lock in</button></form>`;
    if(s.rt === "pair") main = `${top}<form id="pf" class="stack">
      <label class="stack" style="gap:6px"><span class="pclue">${esc(q.c1)}</span><input id="pa" autocomplete="off" placeholder="First word"></label>
      <label class="stack" style="gap:6px"><span class="pclue">${esc(q.c2)}</span><input id="pb" autocomplete="off" placeholder="Rhyming word"></label>
      <button class="full" type="submit">Lock in</button></form>`;
    if(s.rt === "order"){ P.pick = []; main = `${top}<div class="pclue">${esc(q.prompt)}. Tap in order.</div><div class="pick" id="pick"></div>
      <div class="row"><button class="ghost" id="preset" type="button">Reset</button><button id="plock" type="button" style="flex:1" disabled>Lock in</button></div>`; }
    if(s.rt === "map"){ P.map = { vb:FULL.slice(), pin:null };
      main = `${top}<div class="pclue">${esc(whereIs(q.name, q.the))} ${q.emoji || ""}</div><div class="pmap" id="pmap"></div>
      <div class="pmap-hint" id="phint">Tap the map to zoom in.</div>
      <div class="row"><button class="ghost" id="pzoom" type="button">Zoom out</button><button id="plock" type="button" style="flex:1" disabled>Lock in</button></div>`; }
    if(s.rt === "letters") main = `${top}<div class="row" style="gap:14px"><div class="plet">${esc(q.letter)}</div><p style="margin:0;flex:1;min-width:0">Everything starts with <b>${esc(q.letter)}</b>. Fill in what you can.</p></div>
      <form id="pf" class="stack">${(q.cats || []).map((x, i) => `<label class="stack" style="gap:4px"><span class="label">${esc(x)}</span><input id="pl${i}" autocomplete="off" autocapitalize="words" placeholder="${esc(q.letter)}…"></label>`).join("")}<button class="full" type="submit">Lock in</button></form>`;
    if(s.rt === "number") main = `${top}<div class="pclue">${esc(q.prompt)}${q.unit ? ` (${esc(q.unit)})` : ""}</div>
      <form id="pf" class="stack"><input id="pa" inputmode="decimal" autocomplete="off" placeholder="Your guess"><button class="full" type="submit">Lock in</button></form>`;
  }
  else if(s.ph === "reveal"){
    const d = s.rv && s.rv.res ? (s.rv.res[P.name] || 0) : 0;
    main = `<div class="label">The answer</div><div class="big-msg" style="color:var(${s.col})">${esc(s.rv ? s.rv.main : "")}</div>
      <div class="delta ${d ? "good" : "none"}">+${d}</div>${s.rv && s.rv.km && P.name in s.rv.km ? `<div class="pclue">Your pin was ${s.rv.km[P.name].toLocaleString("en-GB")} km away</div>` : ""}<p class="reveal-sub" style="margin:0">${d ? "Nice one." : P.sent === s.k ? "Not this time." : "No answer sent."}</p>`;
  }
  else if(s.ph === "board"){
    const pos = (s.sc || []).findIndex(x => x[0] === P.name);
    main = `<div class="label">After round ${s.rn}</div><div class="big-msg">${pos >= 0 ? "You’re " + ordinal(pos + 1) : "Scores are up"}</div><p class="reveal-sub" style="margin:0">Check the big screen.</p>`;
  }
  else if(s.ph === "final"){
    const pos = (s.sc || []).findIndex(x => x[0] === P.name);
    main = `<div class="big-msg">${pos === 0 ? "You won!" : pos >= 0 ? "You came " + ordinal(pos + 1) : "Game over"}</div><p class="reveal-sub" style="margin:0">${myScore()} points. Thanks for playing.</p>`;
  }
  app.innerHTML = `<div class="phone"><div class="ptop"><span class="me" style="--c:${colorFor(P.name)}">${esc(P.name)}</span><span class="pscore" id="pscore">${myScore()} pts</span></div><div class="pmain">${main}</div></div>`;
  const pf = $("#pf");
  if(pf && s.rt === "letters"){
    const vals = () => s.q.cats.map((_, i) => ($("#pl" + i).value || "").trim().slice(0, 30));
    let tmr = null;
    pf.oninput = () => { clearTimeout(tmr); tmr = setTimeout(() => { if(P.s && P.s.ph === "q" && P.sent !== s.k) P.net.set({ role:"p", name:P.name, a:{ k:s.k, v:vals(), done:false } }); }, 400); };
    pf.onsubmit = e => { e.preventDefault(); clearTimeout(tmr); submit(vals()); };
    $("#pl0").focus();
  }
  else if(pf){ pf.onsubmit = e => { e.preventDefault(); const a = $("#pa").value.trim(); const b = $("#pb");
      if(s.rt === "pair"){ if(!a || !b.value.trim()) return; submit([a.slice(0, 40), b.value.trim().slice(0, 40)]); }
      else { if(!a) return; submit(a.slice(0, 60)); } };
    $("#pa").focus(); }
  if($("#pick")) drawPick();
  if($("#pmap")) drawPMap();
  document.querySelectorAll(".pvote button").forEach(b => b.onclick = () => submit(+b.dataset.v));
  playerTick();
}

function drawPick(){
  const items = (P.s.q && P.s.q.items) || [];
  $("#pick").innerHTML = items.map((it, i) => { const at = P.pick.indexOf(it);
    return `<button type="button" data-i="${i}" class="${at >= 0 ? "sel" : ""}"><span class="n">${at >= 0 ? at + 1 : ""}</span>${esc(it)}</button>`; }).join("");
  $("#pick").querySelectorAll("button").forEach(b => b.onclick = () => { const it = items[+b.dataset.i]; if(!P.pick.includes(it)) P.pick.push(it); drawPick(); });
  $("#plock").disabled = P.pick.length !== items.length;
  $("#plock").onclick = () => submit(P.pick.slice());
  $("#preset").onclick = () => { P.pick = []; drawPick(); };
}
function drawPMap(){
  const m = P.map, w = m.vb[2];
  $("#pmap").innerHTML = mapSvg(m.vb, m.pin ? pin(m.pin[0], m.pin[1], colorFor(P.name), w) : "", "pmsvg");
  const zoomed = w < 360;
  $("#phint").textContent = !zoomed ? (m.pin ? "Your pin is in. Tap to zoom and move it, or lock in." : "Tap the map to zoom in.") : (m.pin ? "Tap again to move your pin." : "Now tap to drop your pin.");
  $("#pzoom").disabled = !zoomed;
  $("#plock").disabled = !m.pin;
  $("#pmsvg").onclick = e => {
    const svg = $("#pmsvg"), pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const x = Math.min(360, Math.max(0, p.x)), y = Math.min(150, Math.max(6, p.y));
    if(!zoomed){ const W = 54, Hh = 36; m.vb = [Math.min(360 - W, Math.max(0, x - W/2)), Math.min(150 - Hh, Math.max(-20, y - Hh/2)), W, Hh]; }
    else m.pin = [+(90 - y).toFixed(3), +(x - 180).toFixed(3)];
    drawPMap();
  };
  $("#pzoom").onclick = () => { m.vb = FULL.slice(); drawPMap(); };
  $("#plock").onclick = () => { if(m.pin) submit(m.pin); };
}
const ordinal = n => n + (["th","st","nd","rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)] || "th");

/* ============================================================ boot */
if(location.hash === "#play") renderJoin(); else renderStart();
</script>
